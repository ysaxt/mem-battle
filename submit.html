
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мем Битва — Загрузить мем</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #20243a;
    }

    header {
      background: white;
      border-bottom: 1px solid #e8eaf2;
      padding: 16px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
      color: #6257e8;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    nav a {
      text-decoration: none;
      color: #62677a;
      font-weight: 600;
    }

    nav a.active,
    nav a:hover {
      color: #6257e8;
    }

    .container {
      max-width: 650px;
      margin: 45px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 4px 20px rgba(30, 35, 70, 0.05);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .description {
      color: #777;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .upload-area {
      border: 2px dashed #c9c5f7;
      background: #fafaff;
      padding: 35px 20px;
      border-radius: 15px;
      text-align: center;
      margin-bottom: 20px;
    }

    .upload-area p {
      color: #777;
      margin-bottom: 15px;
    }

    input[type="file"] {
      max-width: 100%;
    }

    .preview {
      display: none;
      margin: 20px 0;
      text-align: center;
    }

    .preview img {
      max-width: 100%;
      max-height: 300px;
      border-radius: 12px;
    }

    .button {
      width: 100%;
      background: #6257e8;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .button:hover {
      background: #5146d3;
    }

    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      line-height: 1.5;
      text-align: center;
    }

    .success {
      color: #24864a;
    }

    .error {
      color: #d04444;
    }

    .user-info {
      color: #6257e8;
      font-weight: 700;
      margin-bottom: 20px;
    }

    @media (max-width: 600px) {
      header {
        padding: 15px 20px;
      }

      nav {
        gap: 12px;
      }

      .card {
        padding: 22px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

<header>
  <a href="index.html" class="logo">MEM BATTLE</a>

  <nav>
    <a href="index.html">Батлы</a>
    <a href="submit.html" class="active">Загрузить мем</a>
    <a href="profile.html">Профиль</a>
    <a href="#" id="logoutLink">Выйти</a>
  </nav>
</header>

<main class="container">

  <section class="card">
    <h1>Загрузить мем</h1>

    <p class="description">
      Загрузи свой мем, чтобы он мог попасть в битву с другими мемами.
      После загрузки он отправится на модерацию.
    </p>

    <div class="user-info" id="userInfo">
      Проверка аккаунта...
    </div>

    <form id="uploadForm">

      <div class="upload-area">
        <p>Выбери изображение для загрузки</p>
        <input
          type="file"
          id="memeFile"
          accept="image/jpeg,image/png,image/webp,image/gif"
          required
        >
      </div>

      <div class="preview" id="preview">
        <img id="previewImage" alt="Предпросмотр мема">
      </div>

      <button type="submit" class="button" id="uploadButton">
        Загрузить мем
      </button>

    </form>

    <div id="message"></div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
  const db = supabaseClient;

  let currentUser = null;

  async function initPage() {
    const message = document.getElementById("message");

    try {
      if (typeof supabaseClient === "undefined") {
        throw new Error("Не найден клиент Supabase. Проверь supabase.js");
      }

      const { data, error } = await db.auth.getUser();

      if (error || !data.user) {
        window.location.href = "login.html";
        return;
      }

      currentUser = data.user;

      const { data: profile, error: profileError } = await db
        .from("profiles")
        .select("username, coins")
        .eq("id", currentUser.id)
        .single();

      if (profileError) throw profileError;

      document.getElementById("userInfo").textContent =
        (profile.username || "Игрок") +
        " · Монеты: " + (profile.coins ?? 0);

    } catch (error) {
      console.error(error);
      message.className = "error";
      message.textContent = error.message;
    }
  }

  document.getElementById("memeFile").addEventListener("change", function () {
    const file = this.files[0];
    const preview = document.getElementById("preview");
    const previewImage = document.getElementById("previewImage");

    if (!file) {
      preview.style.display = "none";
      return;
    }

    const allowedTypes = [
      "image/jpeg",
      "image/png",
      "image/webp",
      "image/gif"
    ];

    if (!allowedTypes.includes(file.type)) {
      alert("Можно загружать только JPG, PNG, WEBP и GIF.");
      this.value = "";
      preview.style.display = "none";
      return;
    }

    if (file.size > 10 * 1024 * 1024) {
      alert("Максимальный размер файла — 10 МБ.");
      this.value = "";
      preview.style.display = "none";
      return;
    }

    previewImage.src = URL.createObjectURL(file);
    preview.style.display = "block";
  });

  document.getElementById("uploadForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const fileInput = document.getElementById("memeFile");
    const button = document.getElementById("uploadButton");
    const message = document.getElementById("message");

    const file = fileInput.files[0];

    message.textContent = "";
    message.className = "";

    if (!currentUser) {
      message.className = "error";
      message.textContent = "Необходимо войти в аккаунт.";
      return;
    }

    if (!file) {
      message.className = "error";
      message.textContent = "Сначала выбери изображение.";
      return;
    }

    const allowedTypes = [
      "image/jpeg",
      "image/png",
      "image/webp",
      "image/gif"
    ];

    if (!allowedTypes.includes(file.type)) {
      message.className = "error";
      message.textContent = "Неподдерживаемый формат изображения.";
      return;
    }

    if (file.size > 10 * 1024 * 1024) {
      message.className = "error";
      message.textContent = "Максимальный размер файла — 10 МБ.";
      return;
    }

    button.disabled = true;
    button.textContent = "Загрузка...";

    try {
      const extension = file.name.split(".").pop().toLowerCase();
      const filePath =
        currentUser.id + "/" +
        crypto.randomUUID() + "." +
        extension;

      const { error: uploadError } = await db
        .storage
        .from("memes")
        .upload(filePath, file, {
          cacheControl: "3600",
          upsert: false,
          contentType: file.type
        });

      if (uploadError) throw uploadError;

      const { data: publicData } = db
        .storage
        .from("memes")
        .getPublicUrl(filePath);

      const imageUrl = publicData.publicUrl;

      const { error: insertError } = await db
        .from("memes")
        .insert({
          user_id: currentUser.id,
          image_url: imageUrl
        });

      if (insertError) throw insertError;

      message.className = "success";
      message.textContent =
        "Мем успешно загружен! Он отправлен на модерацию.";

      fileInput.value = "";
      document.getElementById("preview").style.display = "none";

    } catch (error) {
      console.error(error);

      message.className = "error";
      message.textContent = "Ошибка загрузки: " + error.message;

    } finally {
      button.disabled = false;
      button.textContent = "Загрузить мем";
    }
  });

  document.getElementById("logoutLink").addEventListener("click", async function (e) {
    e.preventDefault();

    await db.auth.signOut();
    window.location.href = "login.html";
  });

  initPage();
</script>

</body>
</html>
