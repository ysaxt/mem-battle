<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mem Battle</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f2f6ff;
      font-family: 'Inter', Arial, sans-serif;
      color: #172b4d;
    }

    header {
      min-height: 105px;
      background: white;
      border-bottom: 2px solid #dce7ff;
      padding: 20px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
      flex-wrap: wrap;
    }

    .left-side {
      display: flex;
      flex-direction: column;
    }

    .logo {
      font-family: 'Russo One', sans-serif;
      font-size: 32px;
      text-decoration: none;
      color: #1769e0;
      letter-spacing: 1px;
    }

    .logo span { color: #e53945; }

    .navigation {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .navigation a {
      text-decoration: none;
      color: #31517e;
      background: #f2f6ff;
      padding: 11px 17px;
      border-radius: 9px;
      font-weight: 700;
      font-size: 14px;
      transition: 0.2s;
    }

    .navigation a:hover,
    .navigation a.active {
      background: #1769e0;
      color: white;
    }

    .right-side {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .user-info { text-align: right; }

    .username {
      font-weight: 800;
      font-size: 16px;
      color: #1769e0;
    }

    .balance {
      margin-top: 5px;
      font-size: 14px;
      color: #71809b;
    }

    .balance span {
      color: #e53945;
      font-weight: 800;
    }

    .logout {
      border: none;
      background: #e53945;
      color: white;
      padding: 12px 19px;
      border-radius: 9px;
      font-weight: 700;
      cursor: pointer;
    }

    .logout:hover { background: #c62835; }

    main {
      max-width: 1400px;
      margin: 40px auto;
      padding: 0 25px;
    }

    .battle-heading {
      text-align: center;
      margin-bottom: 35px;
    }

    .battle-heading h1 {
      font-family: 'Russo One', sans-serif;
      color: #1769e0;
      font-size: 36px;
      margin: 0 0 10px;
    }

    .battle-heading h1 span { color: #e53945; }

    .battle-heading p {
      color: #71809b;
      margin: 0;
    }

    #message {
      text-align: center;
      color: #71809b;
      font-size: 15px;
      margin: 25px 0;
      line-height: 1.6;
    }

    #message.error { color: #e53945; }

    .category {
      margin-bottom: 42px;
    }

    .category-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 17px;
      padding-bottom: 12px;
      border-bottom: 2px solid #dce7ff;
    }

    .category-header h2 {
      font-family: 'Russo One', sans-serif;
      color: #1769e0;
      font-size: 23px;
      margin: 0;
    }

    .category-info {
      color: #71809b;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .battles-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .battle-card {
      background: white;
      border: 2px solid #dce7ff;
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 7px 25px rgba(30, 80, 160, 0.06);
      min-width: 0;
    }

    .battle-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 13px;
    }

    .battle-number {
      color: #71809b;
      font-size: 12px;
      font-weight: 800;
    }

    .battle-timer {
      font-family: 'Russo One', sans-serif;
      color: #1769e0;
      font-size: 17px;
      white-space: nowrap;
    }

    .battle-timer.urgent { color: #e53945; }

    .battle-pair {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
      align-items: stretch;
    }

    .meme-card {
      min-width: 0;
      padding: 9px;
      border: 2px solid #edf2ff;
      border-radius: 12px;
      text-align: center;
      transition: 0.2s;
    }

    .meme-card.winner {
      border-color: #20a66a;
      background: #eafff2;
    }

    /* Увеличенные картинки мемов */
    .meme-card img {
      width: 100%;
      height: 300px;
      object-fit: contain;
      background: #f8faff;
      border-radius: 8px;
      display: block;
    }

    .bet-input {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border: 2px solid #dce7ff;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      outline: none;
      color: #172b4d;
    }

    .bet-input:focus {
      border-color: #1769e0;
    }

    .bet-input:disabled {
      background: #f2f6ff;
      opacity: 0.6;
    }

    .vote-button {
      width: 100%;
      margin-top: 10px;
      padding: 11px 5px;
      border: none;
      border-radius: 8px;
      background: #1769e0;
      color: white;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
    }

    .vote-button:hover:not(:disabled) {
      background: #0d50b5;
    }

    .vote-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .vote-count {
      margin-top: 8px;
      color: #71809b;
      font-size: 12px;
      font-weight: 800;
    }

    .battle-status {
      margin-top: 13px;
      padding: 9px;
      border-radius: 8px;
      background: #f2f6ff;
      color: #71809b;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
    }

    .battle-status.result {
      color: #1769e0;
      background: #eaf2ff;
    }

    .empty-category {
      padding: 20px;
      text-align: center;
      color: #9aa8c0;
      background: white;
      border: 1px dashed #dce7ff;
      border-radius: 12px;
      font-size: 13px;
    }

    @media (max-width: 850px) {
      .battles-grid { grid-template-columns: 1fr; }
      .meme-card img { height: 280px; }
    }

    @media (max-width: 550px) {
      header { align-items: flex-start; }

      .right-side {
        width: 100%;
        justify-content: space-between;
      }

      .navigation { gap: 7px; }

      .navigation a {
        padding: 9px 10px;
        font-size: 12px;
      }

      main {
        padding: 0 12px;
        margin-top: 28px;
      }

      .battle-heading h1 { font-size: 28px; }
      .category-header h2 { font-size: 19px; }
      .battle-card { padding: 10px; }
      .battle-pair { gap: 7px; }
      .meme-card { padding: 6px; }
      .meme-card img { height: 210px; }

      .vote-button {
        font-size: 11px;
        padding: 10px 3px;
      }

      .battle-timer { font-size: 15px; }
    }
  </style>
</head>

<body>

<header>
  <div class="left-side">
    <a href="index.html" class="logo">MEM <span>BATTLE</span></a>

    <nav class="navigation">
      <a href="index.html" class="active">Главная</a>
      <a href="profile.html">Профиль</a>
      <a href="submit.html">Отправить мем</a>
      <a href="top.html">Топ</a>
    </nav>
  </div>

  <div class="right-side">
    <div class="user-info">
      <div class="username" id="username">Загрузка...</div>
      <div class="balance">Баланс: <span id="balance">...</span></div>
    </div>
    <button class="logout" id="logoutBtn">Выйти</button>
  </div>
</header>

<main>
  <div class="battle-heading">
    <h1>MEM <span>BATTLE</span></h1>
    <p>Выбирай лучшие мемы и делай ставки!</p>
  </div>

  <div id="message">Подключаемся к батлам...</div>
  <div id="categories"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
  const categories = [
    { name: '30 секунд', duration: 30, slots: 5 },
    { name: '1 минута', duration: 60, slots: 4 },
    { name: '3 минуты', duration: 180, slots: 3 },
    { name: '5 минут', duration: 300, slots: 2 },
    { name: '10 минут', duration: 600, slots: 1 },
    { name: '1 час', duration: 3600, slots: 1 },
    { name: '24 часа', duration: 86400, slots: 1 },
    { name: '7 дней', duration: 604800, slots: 1 }
  ];

  let currentUser = null;
  let currentBalance = 0;
  let loadingBattles = false;

  const battleElements = new Map();
  const votingBattles = new Set();

  const message = document.getElementById('message');
  const categoriesContainer = document.getElementById('categories');

  function getCategory(row) {
    return categories.find(category =>
      Number(category.duration) === Number(row.duration_seconds)
    );
  }

  function formatTime(seconds) {
    seconds = Math.max(0, seconds);

    if (seconds < 60) {
      return seconds + ' сек.';
    }

    if (seconds < 3600) {
      const minutes = Math.floor(seconds / 60);
      const remaining = seconds % 60;

      return minutes + ':' + String(remaining).padStart(2, '0');
    }

    if (seconds < 86400) {
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);

      return hours + ' ч. ' + minutes + ' мин.';
    }

    const days = Math.floor(seconds / 86400);
    const hours = Math.floor((seconds % 86400) / 3600);

    return days + ' д. ' + hours + ' ч.';
  }

  function getSecondsLeft(row) {
    return Math.max(
      0,
      Math.ceil((new Date(row.ends_at).getTime() - Date.now()) / 1000)
    );
  }

  function createCategorySections() {
    categoriesContainer.innerHTML = '';

    categories.forEach(category => {
      const section = document.createElement('section');
      section.className = 'category';
      section.dataset.duration = category.duration;

      section.innerHTML = `
        <div class="category-header">
          <h2>${category.name}</h2>
          <div class="category-info">
            <span class="category-count">0</span> / ${category.slots} батлов
          </div>
        </div>
        <div class="battles-grid"></div>
      `;

      categoriesContainer.appendChild(section);
    });
  }

  function createBattleCard(row) {
    const card = document.createElement('div');
    card.className = 'battle-card';
    card.dataset.battleId = row.battle_id;

    card.innerHTML = `
      <div class="battle-top">
        <div class="battle-number">БАТЛ</div>
        <div class="battle-timer">--</div>
      </div>

      <div class="battle-pair">
        <div class="meme-card card-a">
          <img class="image-a" alt="Первый мем">

          <input
            class="bet-input bet-a"
            type="number"
            min="1"
            step="1"
            placeholder="Ставка монет"
          >

          <button class="vote-button vote-a">Поставить и выбрать</button>
        </div>

        <div class="meme-card card-b">
          <img class="image-b" alt="Второй мем">

          <input
            class="bet-input bet-b"
            type="number"
            min="1"
            step="1"
            placeholder="Ставка монет"
          >

          <button class="vote-button vote-b">Поставить и выбрать</button>
        </div>
      </div>

      <div class="battle-status">Загрузка...</div>
    `;

    card.querySelector('.vote-a').addEventListener('click', () => {
      castVote(
        row.battle_id,
        row.meme_a_id,
        card.querySelector('.bet-a')
      );
    });

    card.querySelector('.vote-b').addEventListener('click', () => {
      castVote(
        row.battle_id,
        row.meme_b_id,
        card.querySelector('.bet-b')
      );
    });

    return card;
  }

  function updateBattleCard(card, row) {
    const secondsLeft = getSecondsLeft(row);
    const completed = row.battle_status === 'completed';
    const myVote = row.my_vote;
    const voting = votingBattles.has(row.battle_id);

    card.dataset.endsAt = row.ends_at;

    const imageA = card.querySelector('.image-a');
    const imageB = card.querySelector('.image-b');

    if (imageA.src !== row.meme_a_url) {
      imageA.src = row.meme_a_url;
    }

    if (imageB.src !== row.meme_b_url) {
      imageB.src = row.meme_b_url;
    }

    const timer = card.querySelector('.battle-timer');

    timer.textContent = completed
      ? 'Результат'
      : formatTime(secondsLeft);

    timer.classList.toggle(
      'urgent',
      !completed && secondsLeft <= 5
    );

    const cardA = card.querySelector('.card-a');
    const cardB = card.querySelector('.card-b');

    cardA.classList.toggle(
      'winner',
      completed && row.winner_meme_id === row.meme_a_id
    );

    cardB.classList.toggle(
      'winner',
      completed && row.winner_meme_id === row.meme_b_id
    );

    const voteA = card.querySelector('.vote-a');
    const voteB = card.querySelector('.vote-b');

    const betA = card.querySelector('.bet-a');
    const betB = card.querySelector('.bet-b');

    const status = card.querySelector('.battle-status');

    if (completed) {
      voteA.disabled = true;
      voteB.disabled = true;
      betA.disabled = true;
      betB.disabled = true;

      voteA.textContent = 'Раунд завершён';
      voteB.textContent = 'Раунд завершён';

      status.className = 'battle-status result';

      if (row.winner_meme_id === row.meme_a_id) {
        status.textContent = 'Победил первый мем!';
      } else if (row.winner_meme_id === row.meme_b_id) {
        status.textContent = 'Победил второй мем!';
      } else {
        status.textContent = 'Ничья! Ставки возвращены.';
      }

      return;
    }

    if (secondsLeft === 0) {
      voteA.disabled = true;
      voteB.disabled = true;
      betA.disabled = true;
      betB.disabled = true;

      status.textContent = 'Подсчитываем результаты...';
      status.className = 'battle-status';
      return;
    }

    if (myVote) {
      voteA.disabled = true;
      voteB.disabled = true;
      betA.disabled = true;
      betB.disabled = true;

      voteA.textContent = myVote === row.meme_a_id
        ? 'Ты выбрал этот мем'
        : 'Голос принят';

      voteB.textContent = myVote === row.meme_b_id
        ? 'Ты выбрал этот мем'
        : 'Голос принят';

      status.textContent = 'Твоя ставка принята!';
      status.className = 'battle-status';

      return;
    }

    voteA.disabled = voting;
    voteB.disabled = voting;
    betA.disabled = voting;
    betB.disabled = voting;

    voteA.textContent = 'Поставить и выбрать';
    voteB.textContent = 'Поставить и выбрать';

    status.textContent = voting
      ? 'Отправляем ставку...'
      : 'Выбери мем и укажи ставку!';

    status.className = 'battle-status';
  }

  async function refreshBattles() {
    if (loadingBattles) return;

    loadingBattles = true;

    try {
      const { data, error } = await supabaseClient.rpc('get_battles');

      if (error) {
        message.textContent = 'Ошибка загрузки батлов: ' + error.message;
        message.className = 'error';
        return;
      }

      message.textContent = '';
      message.className = '';

      const rows = Array.isArray(data) ? data : [];
      const receivedIds = new Set();

      categories.forEach(category => {
        const section = categoriesContainer.querySelector(
          `[data-duration="${category.duration}"]`
        );

        const grid = section.querySelector('.battles-grid');

        const categoryRows = rows.filter(row =>
          Number(row.duration_seconds) === category.duration
        );

        section.querySelector('.category-count').textContent =
          categoryRows.length;

        if (categoryRows.length === 0) {
          grid.innerHTML = `
            <div class="empty-category">
              Пока нет батлов. Они появятся, когда будут доступны мемы.
            </div>
          `;
          return;
        }

        const empty = grid.querySelector('.empty-category');
        if (empty) empty.remove();

        categoryRows.forEach(row => {
          receivedIds.add(row.battle_id);

          let card = battleElements.get(row.battle_id);

          if (!card) {
            card = createBattleCard(row);
            battleElements.set(row.battle_id, card);
            grid.appendChild(card);
          } else if (card.parentElement !== grid) {
            grid.appendChild(card);
          }

          updateBattleCard(card, row);
        });
      });

      for (const [battleId, card] of battleElements.entries()) {
        if (!receivedIds.has(battleId)) {
          card.remove();
          battleElements.delete(battleId);
          votingBattles.delete(battleId);
        }
      }

    } catch (error) {
      message.textContent = 'Ошибка: ' + error.message;
      message.className = 'error';
    } finally {
      loadingBattles = false;
    }
  }

  async function refreshBalance() {
    const { data, error } = await supabaseClient
      .from('profiles')
      .select('coins')
      .eq('id', currentUser.id)
      .single();

    if (error) {
      console.error('Ошибка обновления баланса:', error);
      return;
    }

    currentBalance = Number(data.coins);

    document.getElementById('balance').textContent =
      currentBalance.toLocaleString('ru-RU');
  }

  async function castVote(battleId, memeId, input) {
    if (votingBattles.has(battleId)) return;

    const card = battleElements.get(battleId);
    if (!card) return;

    const betAmount = Number(input.value);

    if (
      !Number.isSafeInteger(betAmount) ||
      betAmount <= 0
    ) {
      alert('Укажи целое число монет больше нуля.');
      input.focus();
      return;
    }

    if (betAmount > currentBalance) {
      alert('У тебя недостаточно монет!');
      return;
    }

    votingBattles.add(battleId);

    const buttons = card.querySelectorAll('.vote-button');
    const inputs = card.querySelectorAll('.bet-input');

    buttons.forEach(button => button.disabled = true);
    inputs.forEach(field => field.disabled = true);

    card.querySelector('.battle-status').textContent =
      'Отправляем ставку...';

    try {
      const { error } = await supabaseClient.rpc('cast_battle_vote', {
        p_battle_id: battleId,
        p_meme_id: memeId,
        p_bet_amount: betAmount
      });

      if (error) {
        alert('Не удалось сделать ставку: ' + error.message);
      } else {
        await refreshBalance();
      }

    } catch (error) {
      alert('Ошибка: ' + error.message);

    } finally {
      votingBattles.delete(battleId);
      await refreshBattles();
    }
  }

  async function initPage() {
    const { data, error } = await supabaseClient.auth.getSession();

    if (error || !data.session) {
      location.replace('login.html');
      return;
    }

    currentUser = data.session.user;

    const { data: profile, error: profileError } = await supabaseClient
      .from('profiles')
      .select('username, coins')
      .eq('id', currentUser.id)
      .single();

    if (profileError || !profile) {
      document.getElementById('username').textContent = 'Пользователь';
      document.getElementById('balance').textContent = 'Ошибка';
    } else {
      document.getElementById('username').textContent = profile.username;

      currentBalance = Number(profile.coins);

      document.getElementById('balance').textContent =
        currentBalance.toLocaleString('ru-RU');
    }

    createCategorySections();

    await refreshBattles();

    setInterval(refreshBattles, 3000);

    setInterval(() => {
      battleElements.forEach((card) => {
        const timer = card.querySelector('.battle-timer');

        if (timer.textContent === 'Результат') return;

        const endTime = card.dataset.endsAt;

        if (endTime) {
          const seconds = Math.max(
            0,
            Math.ceil((new Date(endTime).getTime() - Date.now()) / 1000)
          );

          timer.textContent = formatTime(seconds);
          timer.classList.toggle('urgent', seconds <= 5);
        }
      });
    }, 250);
  }

  document.getElementById('logoutBtn').onclick = async () => {
    const { error } = await supabaseClient.auth.signOut();

    if (error) {
      alert('Не удалось выйти: ' + error.message);
      return;
    }

    location.replace('login.html');
  };

  initPage();
</script>

</body>
</html>
