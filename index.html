
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мем Битва</title>
</head>
<body style="background:#111;color:white;font-family:Arial;text-align:center;padding-top:20vh">
  <h1 id="status">ПРОВЕРКА...</h1>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script>
    async function checkLogin() {
      try {
        if (typeof supabaseClient === 'undefined') {
          throw new Error('Не удалось подключить supabase.js');
        }

        const { data, error } = await supabaseClient.auth.getSession();

        if (error) throw error;

        if (data.session) {
          document.getElementById('status').textContent = 'УСПЕШНО';
        } else {
          location.replace('./login.html');
        }
      } catch (error) {
        document.getElementById('status').textContent =
          'ОШИБКА: ' + error.message;
      }
    }

    checkLogin();
  </script>
</body>
</html>
