
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mem Battle</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f2f6ff;
      font-family: 'Inter', Arial, sans-serif;
      color: #172b4d;
    }

    header {
      min-height: 105px;
      background: white;
      border-bottom: 2px solid #dce7ff;
      padding: 20px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
      flex-wrap: wrap;
    }

    .left-side {
      display: flex;
      flex-direction: column;
    }

    .logo {
      font-family: 'Russo One', sans-serif;
      font-size: 32px;
      text-decoration: none;
      color: #1769e0;
      letter-spacing: 1px;
    }

    .logo span { color: #e53945; }

    .navigation {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .navigation a {
      text-decoration: none;
      color: #31517e;
      background: #f2f6ff;
      padding: 11px 17px;
      border-radius: 9px;
      font-weight: 700;
      font-size: 14px;
      transition: 0.2s;
    }

    .navigation a:hover,
    .navigation a.active {
      background: #1769e0;
      color: white;
    }

    .right-side {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .user-info { text-align: right; }

    .username {
      font-weight: 800;
      font-size: 16px;
      color: #1769e0;
    }

    .balance {
      margin-top: 5px;
      font-size: 14px;
      color: #71809b;
    }

    .balance span {
      color: #e53945;
      font-weight: 800;
    }

    .logout {
      border: none;
      background: #e53945;
      color: white;
      padding: 12px 19px;
      border-radius: 9px;
      font-weight: 700;
      cursor: pointer;
    }

    .logout:hover { background: #c62835; }

    main {
      max-width: 1200px;
      margin: 45px auto;
      padding: 0 25px;
    }

    .battle-heading {
      text-align: center;
      margin-bottom: 30px;
    }

    .battle-heading h1 {
      font-family: 'Russo One', sans-serif;
      color: #1769e0;
      font-size: 34px;
      margin: 0 0 10px;
    }

    .battle-heading h1 span { color: #e53945; }

    .battle-heading p {
      color: #71809b;
      margin: 0;
    }

    .timer-box {
      width: fit-content;
      min-width: 180px;
      margin: 0 auto 30px;
      padding: 15px 30px;
      background: white;
      border: 2px solid #dce7ff;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(30, 80, 160, 0.06);
    }

    .timer-label {
      font-size: 12px;
      font-weight: 800;
      color: #71809b;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #timer {
      font-family: 'Russo One', sans-serif;
      font-size: 36px;
      color: #1769e0;
      margin-top: 5px;
    }

    #timer.urgent { color: #e53945; }

    .battle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    .battle.changing { opacity: 0; }

    .meme-card {
      background: white;
      border: 2px solid #dce7ff;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 10px 35px rgba(30, 80, 160, 0.08);
      text-align: center;
      min-width: 0;
      transition: border-color 0.3s, background 0.3s, box-shadow 0.3s;
    }

    .meme-card.winner {
      border: 3px solid #20a66a;
      background: #eafff2;
      box-shadow: 0 0 25px rgba(32, 166, 106, 0.3);
    }

    .meme-card img {
      width: 100%;
      height: 350px;
      object-fit: contain;
      background: #f8faff;
      border-radius: 12px;
    }

    .meme-card button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #1769e0;
      color: white;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
    }

    .meme-card button:hover:not(:disabled) {
      background: #0d50b5;
    }

    .meme-card button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .vote-count {
      margin-top: 12px;
      font-weight: 800;
      color: #71809b;
      min-height: 20px;
    }

    .vs {
      text-align: center;
      color: #e53945;
      font-family: 'Russo One', sans-serif;
      font-size: 24px;
      margin: 20px 0;
      display: none;
    }

    #message {
      text-align: center;
      color: #71809b;
      font-size: 16px;
      margin: 30px 0;
      line-height: 1.6;
    }

    .result-message {
      color: #1769e0 !important;
      font-weight: 800;
    }

    @media (max-width: 700px) {
      header { align-items: flex-start; }

      .right-side {
        width: 100%;
        justify-content: space-between;
      }

      .navigation { gap: 7px; }

      .navigation a { padding: 10px 12px; }

      .battle { grid-template-columns: 1fr; }

      .battle-heading h1 { font-size: 27px; }

      .meme-card img { height: 280px; }

      .vs { display: block; }
    }
  </style>
</head>

<body>

<header>
  <div class="left-side">
    <a href="index.html" class="logo">MEM <span>BATTLE</span></a>

    <nav class="navigation">
      <a href="index.html" class="active">Главная</a>
      <a href="profile.html">Профиль</a>
      <a href="submit.html">Отправить мем</a>
      <a href="top.html">Топ</a>
    </nav>
  </div>

  <div class="right-side">
    <div class="user-info">
      <div class="username" id="username">Загрузка...</div>
      <div class="balance">Баланс: <span id="balance">...</span></div>
    </div>
    <button class="logout" id="logoutBtn">Выйти</button>
  </div>
</header>

<main>
  <div class="battle-heading">
    <h1>МЕМ <span>БАТЛЫ</span></h1>
    <p>Какой мем лучше? Решать тебе!</p>
  </div>

  <div class="timer-box">
    <div class="timer-label">До конца раунда</div>
    <div id="timer">--:--</div>
  </div>

  <div id="message">Подключаемся к батлу...</div>

  <div class="battle" id="battle" style="display:none">
    <div class="meme-card" id="cardA">
      <img id="memeA" src="" alt="Первый мем">
      <button id="voteA">Выбрать этот мем</button>
      <div class="vote-count" id="countA"></div>
    </div>

    <div class="vs">VS</div>

    <div class="meme-card" id="cardB">
      <img id="memeB" src="" alt="Второй мем">
      <button id="voteB">Выбрать этот мем</button>
      <div class="vote-count" id="countB"></div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
  let currentBattle = null;
  let currentUser = null;
  let lastBattleId = null;
  let loadingBattle = false;
  let transitionTimer = null;

  const message = document.getElementById('message');
  const battleElement = document.getElementById('battle');
  const timerElement = document.getElementById('timer');

  async function initPage() {
    const { data, error } = await supabaseClient.auth.getSession();

    if (error || !data.session) {
      location.replace('login.html');
      return;
    }

    currentUser = data.session.user;

    const { data: profile, error: profileError } = await supabaseClient
      .from('profiles')
      .select('username, coins')
      .eq('id', currentUser.id)
      .single();

    if (profileError || !profile) {
      document.getElementById('username').textContent = 'Пользователь';
      document.getElementById('balance').textContent = 'Ошибка';
    } else {
      document.getElementById('username').textContent = profile.username;
      document.getElementById('balance').textContent =
        Number(profile.coins).toLocaleString('ru-RU');
    }

    await refreshBattle();

    setInterval(refreshBattle, 1000);
    setInterval(updateTimer, 250);
  }

  async function refreshBattle() {
    if (loadingBattle) return;

    loadingBattle = true;

    try {
      const { data, error } = await supabaseClient.rpc('get_current_battle');

      if (error) {
        message.textContent = 'Ошибка загрузки раунда: ' + error.message;
        return;
      }

      const row = Array.isArray(data) ? data[0] : data;

      if (!row) {
        currentBattle = null;
        battleElement.style.display = 'none';
        timerElement.textContent = '--:--';
        message.textContent =
          'Пока недостаточно мемов для батла.';
        return;
      }

      if (row.battle_id !== lastBattleId) {
        showNewBattle(row);
      } else {
        currentBattle = row;
        updateBattleUI();
      }

    } catch (error) {
      message.textContent = 'Ошибка: ' + error.message;
    } finally {
      loadingBattle = false;
    }
  }

  function showNewBattle(row) {
    const isFirstBattle = lastBattleId === null;

    if (transitionTimer) {
      clearTimeout(transitionTimer);
    }

    if (!isFirstBattle) {
      battleElement.classList.add('changing');

      transitionTimer = setTimeout(() => {
        applyBattle(row);
      }, 300);
    } else {
      applyBattle(row);
    }
  }

  function applyBattle(row) {
    currentBattle = row;
    lastBattleId = row.battle_id;

    document.getElementById('memeA').src = row.meme_a_url;
    document.getElementById('memeB').src = row.meme_b_url;

    battleElement.style.display = 'grid';
    battleElement.classList.remove('changing');

    updateBattleUI();
    updateTimer();
  }

  function updateBattleUI() {
    if (!currentBattle) return;

    const row = currentBattle;

    const voteA = document.getElementById('voteA');
    const voteB = document.getElementById('voteB');

    const cardA = document.getElementById('cardA');
    const cardB = document.getElementById('cardB');

    document.getElementById('countA').textContent =
      'Голосов: ' + row.votes_a;

    document.getElementById('countB').textContent =
      'Голосов: ' + row.votes_b;

    const completed = row.battle_status === 'completed';

    cardA.classList.toggle(
      'winner',
      completed && row.winner_meme_id === row.meme_a_id
    );

    cardB.classList.toggle(
      'winner',
      completed && row.winner_meme_id === row.meme_b_id
    );

    if (completed) {
      voteA.disabled = true;
      voteB.disabled = true;

      voteA.textContent = 'Раунд завершён';
      voteB.textContent = 'Раунд завершён';

      if (row.winner_meme_id === row.meme_a_id) {
        message.textContent = 'Победил первый мем!';
      } else if (row.winner_meme_id === row.meme_b_id) {
        message.textContent = 'Победил второй мем!';
      } else {
        message.textContent = 'Ничья!';
      }

      message.className = 'result-message';
      return;
    }

    message.className = '';

    if (row.my_vote) {
      voteA.disabled = true;
      voteB.disabled = true;

      voteA.textContent =
        row.my_vote === row.meme_a_id
          ? 'Вы выбрали этот мем'
          : 'Ожидаем результат';

      voteB.textContent =
        row.my_vote === row.meme_b_id
          ? 'Вы выбрали этот мем'
          : 'Ожидаем результат';

      message.textContent =
        'Твой голос принят! Ждём окончания раунда.';
    } else {
      voteA.disabled = false;
      voteB.disabled = false;

      voteA.textContent = 'Выбрать этот мем';
      voteB.textContent = 'Выбрать этот мем';

      message.textContent = 'Выбери лучший мем до окончания таймера!';
    }
  }

  function updateTimer() {
    if (!currentBattle) return;

    const endTime = new Date(currentBattle.ends_at).getTime();

    const secondsLeft = Math.max(
      0,
      Math.ceil((endTime - Date.now()) / 1000)
    );

    if (currentBattle.battle_status === 'completed') {
      timerElement.textContent = secondsLeft + ' сек.';
      timerElement.classList.remove('urgent');
      return;
    }

    timerElement.textContent = secondsLeft + ' сек.';
    timerElement.classList.toggle('urgent', secondsLeft <= 5);

    if (secondsLeft === 0) {
      document.getElementById('voteA').disabled = true;
      document.getElementById('voteB').disabled = true;
      message.textContent = 'Время вышло! Подсчитываем результаты...';
    }
  }

  async function castVote(memeId) {
    if (!currentBattle) return;

    if (
      currentBattle.battle_status !== 'active' ||
      currentBattle.my_vote
    ) {
      return;
    }

    const battleId = currentBattle.battle_id;

    document.getElementById('voteA').disabled = true;
    document.getElementById('voteB').disabled = true;

    const { error } = await supabaseClient.rpc('cast_battle_vote', {
      p_battle_id: battleId,
      p_meme_id: memeId
    });

    if (error) {
      message.textContent = 'Не удалось проголосовать: ' + error.message;
      await refreshBattle();
      return;
    }

    currentBattle.my_vote = memeId;

    updateBattleUI();
    await refreshBattle();
  }

  document.getElementById('voteA').onclick = () => {
    if (currentBattle) castVote(currentBattle.meme_a_id);
  };

  document.getElementById('voteB').onclick = () => {
    if (currentBattle) castVote(currentBattle.meme_b_id);
  };

  document.getElementById('logoutBtn').onclick = async () => {
    const { error } = await supabaseClient.auth.signOut();

    if (error) {
      alert('Не удалось выйти: ' + error.message);
      return;
    }

    location.replace('login.html');
  };

  initPage();
</script>

</body>
</html>
