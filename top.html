
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мем Битва — Топ мемов</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Russo+One&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #20243a;
    }

    header {
      background: white;
      border-bottom: 1px solid #e8eaf2;
      padding: 16px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo {
      font-family: 'Russo One', sans-serif;
      font-size: 24px;
      color: #6257e8;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    nav a {
      text-decoration: none;
      color: #62677a;
      font-weight: 600;
    }

    nav a.active,
    nav a:hover {
      color: #6257e8;
    }

    .container {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 20px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .refresh-btn {
      background: #6257e8;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 22px;
    }

    .refresh-btn:hover {
      background: #5146d3;
    }

    .refresh-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .top-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .meme-card {
      display: flex;
      align-items: center;
      gap: 20px;
      background: white;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 4px 20px rgba(30, 35, 70, 0.05);
    }

    .rank {
      width: 48px;
      min-width: 48px;
      height: 48px;
      border-radius: 14px;
      background: #f0efff;
      color: #6257e8;
      display: grid;
      place-items: center;
      font-family: 'Russo One', sans-serif;
      font-size: 21px;
    }

    .meme-card:nth-child(1) .rank {
      background: #fff3d5;
      color: #d28a00;
    }

    .meme-card:nth-child(2) .rank {
      background: #edf0f5;
      color: #657187;
    }

    .meme-card:nth-child(3) .rank {
      background: #ffeadc;
      color: #bd6a32;
    }

    .meme-image {
      width: 135px;
      height: 105px;
      object-fit: cover;
      border-radius: 12px;
      background: #edf3fc;
    }

    .meme-info {
      flex: 1;
      min-width: 0;
    }

    .meme-name {
      font-weight: 800;
      font-size: 16px;
      margin-bottom: 8px;
    }

    .meme-wins {
      color: #6257e8;
      font-weight: 800;
      font-size: 14px;
    }

    .empty,
    .error {
      background: white;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      color: #777;
      box-shadow: 0 4px 20px rgba(30, 35, 70, 0.05);
    }

    .error {
      color: #d04444;
    }

    @media (max-width: 600px) {
      header {
        padding: 15px 20px;
      }

      nav {
        gap: 12px;
      }

      h1 {
        font-size: 24px;
      }

      .meme-card {
        gap: 12px;
        padding: 12px;
      }

      .meme-image {
        width: 95px;
        height: 85px;
      }

      .rank {
        width: 38px;
        min-width: 38px;
        height: 38px;
        font-size: 17px;
      }

      .container {
        margin-top: 25px;
      }
    }
  </style>
</head>

<body>

<header>
  <a href="index.html" class="logo">MEM BATTLE</a>

  <nav>
    <a href="index.html">Батлы</a>
    <a href="submit.html">Загрузить мем</a>
    <a href="top.html" class="active">Топ</a>
    <a href="profile.html">Профиль</a>
  </nav>
</header>

<main class="container">

  <h1>Топ мемов</h1>

  <p class="subtitle">
    Самые победоносные мемы Мем Битвы.
  </p>

  <button class="refresh-btn" id="refreshBtn">
    Обновить рейтинг
  </button>

  <div class="top-list" id="topList">
    <div class="empty">Загружаем рейтинг...</div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
  const db = supabaseClient;

  const topList = document.getElementById("topList");
  const refreshBtn = document.getElementById("refreshBtn");

  async function loadTop() {
    refreshBtn.disabled = true;
    refreshBtn.textContent = "Загрузка...";

    topList.innerHTML =
      '<div class="empty">Загружаем рейтинг...</div>';

    try {
      if (typeof supabaseClient === "undefined") {
        throw new Error("Не найден клиент Supabase. Проверь supabase.js");
      }

      const { data: memes, error } = await db
        .from("memes")
        .select("id, image_url, wins, status, created_at")
        .eq("status", "approved")
        .order("wins", { ascending: false })
        .order("created_at", { ascending: true })
        .limit(50);

      if (error) throw error;

      topList.innerHTML = "";

      if (!memes || memes.length === 0) {
        topList.innerHTML =
          '<div class="empty">Пока нет мемов в рейтинге.</div>';
        return;
      }

      memes.forEach((meme, index) => {
        const card = document.createElement("article");
        card.className = "meme-card";

        const rank = document.createElement("div");
        rank.className = "rank";
        rank.textContent = index + 1;

        const image = document.createElement("img");
        image.className = "meme-image";
        image.src = meme.image_url;
        image.alt = "Мем из рейтинга";
        image.loading = "lazy";

        const info = document.createElement("div");
        info.className = "meme-info";

        const name = document.createElement("div");
        name.className = "meme-name";
        name.textContent = "Мем #" + (index + 1);

        const wins = document.createElement("div");
        wins.className = "meme-wins";
        wins.textContent = "🏆 Побед: " + Number(meme.wins || 0);

        info.appendChild(name);
        info.appendChild(wins);

        card.appendChild(rank);
        card.appendChild(image);
        card.appendChild(info);

        topList.appendChild(card);
      });

    } catch (error) {
      console.error(error);

      const errorBox = document.createElement("div");
      errorBox.className = "error";
      errorBox.textContent =
        "Не удалось загрузить рейтинг: " + error.message;

      topList.innerHTML = "";
      topList.appendChild(errorBox);

    } finally {
      refreshBtn.disabled = false;
      refreshBtn.textContent = "Обновить рейтинг";
    }
  }

  refreshBtn.addEventListener("click", loadTop);

  loadTop();
</script>

</body>
</html>
