
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mem Battle — Топ мемов</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f2f6ff;
      font-family: 'Inter', Arial, sans-serif;
      color: #172b4d;
    }

    header {
      min-height: 105px;
      background: white;
      border-bottom: 2px solid #dce7ff;
      padding: 20px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
      flex-wrap: wrap;
    }

    .left-side {
      display: flex;
      flex-direction: column;
    }

    .logo {
      font-family: 'Russo One', sans-serif;
      font-size: 32px;
      text-decoration: none;
      color: #1769e0;
      letter-spacing: 1px;
    }

    .logo span { color: #e53945; }

    .navigation {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .navigation a {
      text-decoration: none;
      color: #31517e;
      background: #f2f6ff;
      padding: 11px 17px;
      border-radius: 9px;
      font-weight: 700;
      font-size: 14px;
      transition: 0.2s;
    }

    .navigation a:hover,
    .navigation a.active {
      background: #1769e0;
      color: white;
    }

    .right-side {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .user-info { text-align: right; }

    .username {
      font-weight: 800;
      font-size: 16px;
      color: #1769e0;
    }

    .balance {
      margin-top: 5px;
      font-size: 14px;
      color: #71809b;
    }

    .balance span {
      color: #e53945;
      font-weight: 800;
    }

    .logout {
      border: none;
      background: #e53945;
      color: white;
      padding: 12px 19px;
      border-radius: 9px;
      font-weight: 700;
      cursor: pointer;
    }

    .logout:hover { background: #c62835; }

    main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 25px;
    }

    .page-heading {
      text-align: center;
      margin-bottom: 30px;
    }

    .page-heading h1 {
      font-family: 'Russo One', sans-serif;
      color: #1769e0;
      font-size: 36px;
      margin: 0 0 10px;
    }

    .page-heading h1 span { color: #e53945; }

    .page-heading p {
      color: #71809b;
      margin: 0;
    }

    .top-actions {
      display: flex;
      justify-content: center;
      margin-bottom: 22px;
    }

    .refresh-btn {
      border: none;
      background: #1769e0;
      color: white;
      padding: 12px 20px;
      border-radius: 9px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
    }

    .refresh-btn:hover:not(:disabled) {
      background: #0d50b5;
    }

    .refresh-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .top-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .meme-card {
      display: flex;
      align-items: center;
      gap: 20px;
      background: white;
      border: 2px solid #dce7ff;
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 7px 25px rgba(30, 80, 160, 0.06);
      min-width: 0;
    }

    .rank {
      width: 52px;
      min-width: 52px;
      height: 52px;
      border-radius: 12px;
      background: #eaf2ff;
      color: #1769e0;
      display: grid;
      place-items: center;
      font-family: 'Russo One', sans-serif;
      font-size: 22px;
    }

    .meme-card:nth-child(1) .rank {
      background: #fff3d5;
      color: #d28a00;
    }

    .meme-card:nth-child(2) .rank {
      background: #edf0f5;
      color: #657187;
    }

    .meme-card:nth-child(3) .rank {
      background: #ffeadc;
      color: #bd6a32;
    }

    .meme-image {
      width: 145px;
      height: 110px;
      object-fit: contain;
      border-radius: 10px;
      background: #f8faff;
      border: 1px solid #edf2ff;
      display: block;
    }

    .meme-info {
      flex: 1;
      min-width: 0;
    }

    .meme-name {
      font-family: 'Russo One', sans-serif;
      color: #1769e0;
      font-size: 17px;
      margin-bottom: 10px;
    }

    .meme-wins {
      color: #e53945;
      font-weight: 800;
      font-size: 14px;
    }

    .empty,
    .error {
      padding: 30px 20px;
      text-align: center;
      color: #71809b;
      background: white;
      border: 2px dashed #dce7ff;
      border-radius: 12px;
      font-size: 14px;
    }

    .error {
      color: #e53945;
    }

    @media (max-width: 850px) {
      .meme-image {
        width: 125px;
        height: 100px;
      }
    }

    @media (max-width: 550px) {
      header { align-items: flex-start; }

      .right-side {
        width: 100%;
        justify-content: space-between;
      }

      .navigation { gap: 7px; }

      .navigation a {
        padding: 9px 10px;
        font-size: 12px;
      }

      main {
        padding: 0 12px;
        margin-top: 28px;
      }

      .page-heading h1 { font-size: 28px; }

      .meme-card {
        gap: 9px;
        padding: 10px;
      }

      .rank {
        width: 38px;
        min-width: 38px;
        height: 38px;
        font-size: 17px;
      }

      .meme-image {
        width: 90px;
        height: 85px;
      }

      .meme-name { font-size: 14px; }
      .meme-wins { font-size: 12px; }
    }
  </style>
</head>

<body>

<header>
  <div class="left-side">
    <a href="index.html" class="logo">MEM <span>BATTLE</span></a>

    <nav class="navigation">
      <a href="index.html">Главная</a>
      <a href="profile.html">Профиль</a>
      <a href="submit.html">Отправить мем</a>
      <a href="top.html" class="active">Топ</a>
    </nav>
  </div>

  <div class="right-side">
    <div class="user-info">
      <div class="username" id="username">Загрузка...</div>
      <div class="balance">Баланс: <span id="balance">...</span></div>
    </div>
    <button class="logout" id="logoutBtn">Выйти</button>
  </div>
</header>

<main>

  <div class="page-heading">
    <h1>ТОП <span>МЕМОВ</span></h1>
    <p>Самые победоносные мемы Мем Битвы!</p>
  </div>

  <div class="top-actions">
    <button class="refresh-btn" id="refreshBtn">
      ОБНОВИТЬ РЕЙТИНГ
    </button>
  </div>

  <div class="top-list" id="topList">
    <div class="empty">Загружаем рейтинг...</div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
  const db = supabaseClient;

  const topList = document.getElementById('topList');
  const refreshBtn = document.getElementById('refreshBtn');

  async function initPage() {
    try {
      const { data, error } = await db.auth.getUser();

      if (error || !data.user) {
        location.replace('login.html');
        return;
      }

      const { data: profile, error: profileError } = await db
        .from('profiles')
        .select('username, coins')
        .eq('id', data.user.id)
        .single();

      if (profileError) throw profileError;

      document.getElementById('username').textContent =
        profile.username || 'Игрок';

      document.getElementById('balance').textContent =
        Number(profile.coins || 0).toLocaleString('ru-RU');

      await loadTop();

    } catch (error) {
      console.error(error);
      showError('Ошибка загрузки профиля: ' + error.message);
    }
  }

  function showError(text) {
    topList.innerHTML = '';
    const box = document.createElement('div');
    box.className = 'error';
    box.textContent = text;
    topList.appendChild(box);
  }

  async function loadTop() {
    refreshBtn.disabled = true;
    refreshBtn.textContent = 'ЗАГРУЗКА...';

    topList.innerHTML =
      '<div class="empty">Загружаем рейтинг...</div>';

    try {
      const { data: memes, error } = await db
        .from('memes')
        .select('id, image_url, wins, status, created_at')
        .eq('status', 'approved')
        .order('wins', { ascending: false })
        .order('created_at', { ascending: true })
        .limit(50);

      if (error) throw error;

      topList.innerHTML = '';

      if (!memes || memes.length === 0) {
        topList.innerHTML =
          '<div class="empty">Пока нет мемов в рейтинге.</div>';
        return;
      }

      memes.forEach((meme, index) => {
        const card = document.createElement('article');
        card.className = 'meme-card';

        const rank = document.createElement('div');
        rank.className = 'rank';
        rank.textContent = index + 1;

        const image = document.createElement('img');
        image.className = 'meme-image';
        image.src = meme.image_url;
        image.alt = 'Мем из рейтинга';
        image.loading = 'lazy';

        const info = document.createElement('div');
        info.className = 'meme-info';

        const name = document.createElement('div');
        name.className = 'meme-name';
        name.textContent = 'МЕМ #' + (index + 1);

        const wins = document.createElement('div');
        wins.className = 'meme-wins';
        wins.textContent = '🏆 Побед: ' + Number(meme.wins || 0);

        info.appendChild(name);
        info.appendChild(wins);

        card.appendChild(rank);
        card.appendChild(image);
        card.appendChild(info);

        topList.appendChild(card);
      });

    } catch (error) {
      console.error(error);
      showError('Не удалось загрузить рейтинг: ' + error.message);

    } finally {
      refreshBtn.disabled = false;
      refreshBtn.textContent = 'ОБНОВИТЬ РЕЙТИНГ';
    }
  }

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    const { error } = await db.auth.signOut();

    if (error) {
      alert('Ошибка выхода: ' + error.message);
      return;
    }

    location.replace('login.html');
  });

  refreshBtn.addEventListener('click', loadTop);

  initPage();
</script>

</body>
</html>
