
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мем Битва — Модерация</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Russo+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f4f8ff;
      color: #17233d;
      font-family: 'Inter', sans-serif;
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      padding: 18px 22px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 18px rgba(30,70,130,.07);
    }

    .logo {
      font-family: 'Russo One', sans-serif;
      font-size: 25px;
      color: #246bdb;
      text-decoration: none;
    }

    .nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav a {
      text-decoration: none;
      color: #53627b;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 10px;
    }

    .nav a:hover, .nav a.active {
      color: #246bdb;
      background: #eaf2ff;
    }

    .page-title {
      margin: 35px 0 10px;
      font-family: 'Russo One', sans-serif;
      font-size: 30px;
    }

    .subtitle {
      color: #77869e;
      margin-bottom: 25px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .count {
      color: #77869e;
      font-weight: 700;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      color: white;
      background: #246bdb;
      font-weight: 800;
      cursor: pointer;
      font-size: 14px;
    }

    .btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .btn-green { background: #20a66a; }
    .btn-green:hover { background: #16834d; }

    .btn-red { background: #ed5353; }
    .btn-red:hover { background: #d83c3c; }

    .btn-blue:hover { background: #1558bd; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }

    .meme-card {
      background: white;
      border-radius: 17px;
      padding: 15px;
      box-shadow: 0 5px 22px rgba(30,70,130,.07);
      min-width: 0;
    }

    .meme-image {
      width: 100%;
      height: 230px;
      object-fit: contain;
      background: #f1f5fb;
      border-radius: 12px;
    }

    .meme-info {
      color: #77869e;
      font-size: 12px;
      margin: 12px 0;
      overflow-wrap: anywhere;
    }

    .actions {
      display: flex;
      gap: 9px;
    }

    .actions button {
      flex: 1;
    }

    .empty, .notice {
      background: white;
      border-radius: 17px;
      padding: 30px;
      text-align: center;
      color: #77869e;
      box-shadow: 0 5px 22px rgba(30,70,130,.05);
      line-height: 1.6;
    }

    .notice.error {
      color: #d83c3c;
      background: #fff0f0;
    }

    @media (max-width: 650px) {
      .app { padding: 12px; }
      .header { padding: 15px; }
      .page-title { font-size: 25px; }
    }
  </style>
</head>

<body>
  <div class="app">

    <header class="header">
      <a href="index.html" class="logo">МЕМ БИТВА</a>

      <nav class="nav">
        <a href="index.html">Битвы</a>
        <a href="submit.html">Отправить мем</a>
        <a href="top.html">Топ</a>
        <a href="profile.html">Профиль</a>
        <a href="admin.html" class="active">Модерация</a>
      </nav>
    </header>

    <h1 class="page-title">Модерация мемов</h1>
    <p class="subtitle">
      Проверяй новые мемы и решай, какие попадут в битвы.
    </p>

    <div class="toolbar">
      <div class="count" id="count">Загрузка...</div>
      <button class="btn btn-blue" id="refreshBtn">Обновить</button>
    </div>

    <div id="content">
      <div class="empty">Загружаем мемы...</div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <script>
    const content = document.getElementById('content');
    const count = document.getElementById('count');
    const refreshBtn = document.getElementById('refreshBtn');

    function showNotice(text, isError = false) {
      content.replaceChildren();

      const notice = document.createElement('div');
      notice.className = 'notice' + (isError ? ' error' : '');
      notice.textContent = text;

      content.appendChild(notice);
    }

    function createMemeCard(meme) {
      const card = document.createElement('article');
      card.className = 'meme-card';

      const img = document.createElement('img');
      img.className = 'meme-image';
      img.src = meme.image_url;
      img.alt = 'Мем на модерации';
      img.loading = 'lazy';

      const info = document.createElement('div');
      info.className = 'meme-info';
      info.textContent =
        'Отправлен: ' +
        new Date(meme.created_at).toLocaleString('ru-RU');

      const actions = document.createElement('div');
      actions.className = 'actions';

      const approveBtn = document.createElement('button');
      approveBtn.className = 'btn btn-green';
      approveBtn.textContent = 'Одобрить';

      const rejectBtn = document.createElement('button');
      rejectBtn.className = 'btn btn-red';
      rejectBtn.textContent = 'Отклонить';

      approveBtn.addEventListener('click', () => {
        moderateMeme(meme.id, 'approved', card, approveBtn, rejectBtn);
      });

      rejectBtn.addEventListener('click', () => {
        moderateMeme(meme.id, 'rejected', card, approveBtn, rejectBtn);
      });

      img.addEventListener('error', () => {
        img.alt = 'Не удалось загрузить изображение';
      });

      actions.append(approveBtn, rejectBtn);
      card.append(img, info, actions);

      return card;
    }

    async function checkAdmin() {
      const { data: authData, error: authError } =
        await supabaseClient.auth.getUser();

      if (authError || !authData.user) {
        showNotice('Сначала войди в свой аккаунт.', true);
        count.textContent = '';
        return false;
      }

      const { data: profile, error } = await supabaseClient
        .from('profiles')
        .select('role')
        .eq('id', authData.user.id)
        .single();

      if (error || !profile || profile.role !== 'admin') {
        showNotice('Доступ запрещён. Эта страница только для администратора.', true);
        count.textContent = '';
        return false;
      }

      return true;
    }

    async function loadMemes() {
      refreshBtn.disabled = true;
      count.textContent = 'Загрузка...';
      content.replaceChildren();

      try {
        const isAdmin = await checkAdmin();
        if (!isAdmin) return;

        const { data: memes, error } = await supabaseClient
          .from('memes')
          .select('id, image_url, created_at')
          .eq('status', 'pending')
          .order('created_at', { ascending: true });

        if (error) throw error;

        count.textContent = 'На модерации: ' + memes.length;

        if (memes.length === 0) {
          showNotice('Новых мемов пока нет. Отличная работа!');
          return;
        }

        const grid = document.createElement('div');
        grid.className = 'grid';

        memes.forEach(meme => {
          grid.appendChild(createMemeCard(meme));
        });

        content.replaceChildren(grid);

      } catch (error) {
        console.error(error);
        showNotice('Не удалось загрузить мемы: ' + error.message, true);
      } finally {
        refreshBtn.disabled = false;
      }
    }

    async function moderateMeme(id, status, card, approveBtn, rejectBtn) {
      approveBtn.disabled = true;
      rejectBtn.disabled = true;

      try {
        const { error } = await supabaseClient.rpc('moderate_meme', {
          p_meme_id: id,
          p_status: status
        });

        if (error) throw error;

        card.remove();

        const current = Number(count.textContent.match(/\d+/)?.[0] || 0);
        count.textContent = 'На модерации: ' + Math.max(0, current - 1);

        if (!content.querySelector('.meme-card')) {
          showNotice('Все мемы проверены!');
        }

      } catch (error) {
        console.error(error);
        alert('Не удалось изменить статус: ' + error.message);
        approveBtn.disabled = false;
        rejectBtn.disabled = false;
      }
    }

    refreshBtn.addEventListener('click', loadMemes);

    loadMemes();
  </script>
</body>
</html>
