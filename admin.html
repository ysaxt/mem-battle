<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мем Битва – Админ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo">
      <h1>⚡ Мем Битва</h1>
    </div>
    <div style="display:flex; align-items:center; gap:16px;">
      <div class="balance-box balance-loading" id="headerBalance">🪙 —</div>
      <button id="logoutBtn" style="background:#cc3333; border:none; padding:6px 16px; border-radius:40px; font-weight:700; color:#fff; cursor:pointer;">Выйти</button>
    </div>
  </header>

  <div class="tabs">
    <a href="index.html" class="tab-btn">🏆 Битвы</a>
    <a href="profile.html" class="tab-btn">👤 Профиль</a>
    <a href="top.html" class="tab-btn">📊 Топ</a>
    <a href="submit.html" class="tab-btn">📤 Отправить мем</a>
    <a href="admin.html" class="tab-btn active">🛡️ Админ</a>
  </div>

  <div class="admin-card">
    <h2>🛡️ Модерация мемов</h2>
    <div id="pendingList"><p style="color:#666;">Нет мемов на модерации.</p></div>
  </div>
</div>

<script src="common.js"></script>
<script>
(async()=>{
  const user=await requireAuth({admin:true}); if(!user || !isAdmin())return;
  document.getElementById('logoutBtn').onclick=async()=>{await logoutUser();location.href='login.html'};
  await renderPending();
  if(document.getElementById('userManagement')) await renderUserManagement();
  if(document.getElementById('adminManagement')) await renderAdminManagement();
})();
</script>
</body>
</html>
