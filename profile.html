
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мем Битва — Профиль</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Russo+One&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f2f6ff;
      color: #172033;
      font-family: 'Inter', sans-serif;
    }

    button, a {
      font: inherit;
    }

    .header {
      background: white;
      padding: 16px 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .logo {
      font-family: 'Russo One', sans-serif;
      font-size: 23px;
      color: #1769e0;
      text-decoration: none;
    }

    .nav {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    .nav a {
      color: #536078;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }

    .nav a.active,
    .nav a:hover {
      color: #1769e0;
    }

    .header-user {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 700;
    }

    .logout-btn {
      border: none;
      background: #fff0f0;
      color: #e53945;
      padding: 9px 13px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 700;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 18px 50px;
    }

    .profile-card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: 0 4px 18px rgba(30,60,100,.06);
      margin-bottom: 22px;
    }

    .avatar {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #1769e0;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Russo One', sans-serif;
      font-size: 30px;
      flex-shrink: 0;
    }

    .profile-info h1 {
      margin: 0 0 6px;
      font-family: 'Russo One', sans-serif;
      font-size: 25px;
    }

    .profile-info p {
      margin: 0;
      color: #8290a8;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .balance {
      margin-left: auto;
      text-align: right;
    }

    .balance-label {
      color: #8290a8;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .balance-value {
      color: #1769e0;
      font-family: 'Russo One', sans-serif;
      font-size: 25px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 18px rgba(30,60,100,.05);
    }

    .stat-label {
      color: #8290a8;
      font-size: 13px;
      margin-bottom: 9px;
    }

    .stat-value {
      font-family: 'Russo One', sans-serif;
      font-size: 25px;
      color: #1769e0;
    }

    .stat-value.green {
      color: #16a36a;
    }

    .stat-value.red {
      color: #e53945;
    }

    .section {
      margin-top: 30px;
    }

    .section-title {
      font-family: 'Russo One', sans-serif;
      font-size: 22px;
      margin: 0 0 16px;
    }

    .memes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 16px;
    }

    .meme-card {
      background: white;
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 4px 15px rgba(30,60,100,.05);
      min-width: 0;
    }

    .meme-card img {
      width: 100%;
      height: 190px;
      object-fit: contain;
      background: #f4f6fa;
      border-radius: 9px;
    }

    .meme-info {
      padding: 10px 2px 2px;
      font-size: 13px;
      color: #65728a;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .status {
      font-weight: 700;
    }

    .status.approved {
      color: #16a36a;
    }

    .status.pending {
      color: #d99516;
    }

    .status.rejected {
      color: #e53945;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .history-card {
      background: white;
      border-radius: 14px;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 4px 15px rgba(30,60,100,.05);
      min-width: 0;
    }

    .history-images {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .history-images img {
      width: 76px;
      height: 76px;
      object-fit: contain;
      background: #f4f6fa;
      border-radius: 9px;
    }

    .history-vs {
      color: #9aa5b7;
      font-family: 'Russo One', sans-serif;
      font-size: 12px;
    }

    .history-info {
      flex: 1;
      min-width: 0;
    }

    .history-opponent {
      font-weight: 800;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .history-date {
      color: #8995a9;
      font-size: 12px;
      margin-bottom: 7px;
    }

    .history-result {
      font-size: 13px;
      font-weight: 800;
    }

    .history-result.win {
      color: #16a36a;
    }

    .history-result.loss {
      color: #e53945;
    }

    .history-result.draw {
      color: #8995a9;
    }

    .history-money {
      font-family: 'Russo One', sans-serif;
      font-size: 17px;
      white-space: nowrap;
      margin-left: auto;
    }

    .history-money.positive {
      color: #16a36a;
    }

    .history-money.negative {
      color: #e53945;
    }

    .history-money.neutral {
      color: #8995a9;
    }

    .empty {
      background: white;
      padding: 28px 18px;
      border-radius: 14px;
      color: #8995a9;
      text-align: center;
      font-size: 14px;
    }

    .loading {
      color: #8995a9;
      text-align: center;
      padding: 25px;
    }

    @media (max-width: 650px) {
      .header {
        padding: 14px;
      }

      .logo {
        font-size: 20px;
      }

      .nav {
        order: 3;
        width: 100%;
        justify-content: space-between;
        gap: 8px;
      }

      .nav a {
        font-size: 12px;
      }

      .header-user {
        font-size: 12px;
      }

      .container {
        margin-top: 18px;
        padding: 0 12px 35px;
      }

      .profile-card {
        padding: 17px;
        gap: 12px;
      }

      .avatar {
        width: 58px;
        height: 58px;
        font-size: 23px;
      }

      .profile-info h1 {
        font-size: 19px;
      }

      .profile-info p {
        font-size: 11px;
      }

      .balance-value {
        font-size: 19px;
      }

      .balance-label {
        font-size: 11px;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .stat-card {
        padding: 14px;
      }

      .stat-label {
        font-size: 11px;
      }

      .stat-value {
        font-size: 21px;
      }

      .section-title {
        font-size: 19px;
      }

      .history-card {
        padding: 10px;
        gap: 9px;
      }

      .history-images {
        gap: 4px;
      }

      .history-images img {
        width: 55px;
        height: 60px;
      }

      .history-vs {
        font-size: 10px;
      }

      .history-opponent {
        font-size: 12px;
      }

      .history-date {
        font-size: 10px;
      }

      .history-result {
        font-size: 11px;
      }

      .history-money {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <a href="index.html" class="logo">МЕМ БИТВА</a>

  <nav class="nav">
    <a href="index.html">Битвы</a>
    <a href="profile.html" class="active">Профиль</a>
    <a href="submit.html">Загрузить мем</a>
    <a href="top.html">Топ</a>
  </nav>

  <div class="header-user">
    <span id="headerUsername">Загрузка...</span>
    <button class="logout-btn" id="logoutBtn">Выйти</button>
  </div>
</header>

<main class="container">

  <section class="profile-card">
    <div class="avatar" id="avatar">?</div>

    <div class="profile-info">
      <h1 id="username">Загрузка...</h1>
      <p id="email"></p>
    </div>

    <div class="balance">
      <div class="balance-label">Баланс</div>
      <div class="balance-value" id="balanceStat">0</div>
    </div>
  </section>

  <section class="stats">
    <div class="stat-card">
      <div class="stat-label">Моих мемов загружено</div>
      <div class="stat-value" id="memesCount">0</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">Победы моих мемов</div>
      <div class="stat-value green" id="winsCount">0</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">Сыграно батлов</div>
      <div class="stat-value" id="battlesCount">0</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">Выиграно монет</div>
      <div class="stat-value green" id="coinsWon">0</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">Проиграно монет</div>
      <div class="stat-value red" id="coinsLost">0</div>
    </div>
  </section>

  <section class="section">
    <h2 class="section-title">Мои мемы</h2>
    <div class="memes-grid" id="myMemes">
      <div class="loading">Загрузка мемов...</div>
    </div>
  </section>

  <section class="section">
    <h2 class="section-title">История батлов</h2>
    <div class="history-list" id="battleHistory">
      <div class="loading">Загрузка истории...</div>
    </div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
  const supabase = window.supabaseClient;

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#039;'
    })[char]);
  }

  function formatNumber(value) {
    return Number(value || 0).toLocaleString('ru-RU');
  }

  function formatDate(value) {
    if (!value) return 'Дата неизвестна';

    return new Date(value).toLocaleString('ru-RU', {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });
  }

  function setStat(id, value) {
    const element = document.getElementById(id);
    if (element) element.textContent = formatNumber(value);
  }

  function getStatusName(status) {
    const statuses = {
      approved: 'Одобрен',
      pending: 'На модерации',
      rejected: 'Отклонён'
    };

    return statuses[status] || status || 'Неизвестно';
  }

  function getStatusClass(status) {
    if (status === 'approved') return 'approved';
    if (status === 'rejected') return 'rejected';
    return 'pending';
  }

  async function loadMyMemes(userId) {
    const container = document.getElementById('myMemes');

    const { data: memes, error } = await supabase
      .from('memes')
      .select('id,image_url,wins,status,created_at,rejection_reason')
      .eq('user_id', userId)
      .order('created_at', { ascending: false });

    if (error) {
      console.error('Ошибка загрузки мемов:', error);
      container.innerHTML = '<div class="empty">Не удалось загрузить мемы</div>';
      return;
    }

    memes = memes || [];

    setStat('memesCount', memes.length);

    const totalWins = memes.reduce(
      (sum, meme) => sum + Number(meme.wins || 0),
      0
    );

    setStat('winsCount', totalWins);

    if (!memes.length) {
      container.innerHTML = '<div class="empty">Ты пока не загрузил ни одного мема</div>';
      return;
    }

    container.innerHTML = memes.map(meme => `
      <article class="meme-card">
        <img
          src="${escapeHtml(meme.image_url)}"
          alt="Мем"
          loading="lazy"
        >

        <div class="meme-info">
          <span>Побед: ${formatNumber(meme.wins)}</span>
          <span class="status ${getStatusClass(meme.status)}">
            ${escapeHtml(getStatusName(meme.status))}
          </span>
        </div>

        ${meme.rejection_reason ? `
          <div style="font-size:12px;color:#e53945;padding:5px 2px;">
            Причина: ${escapeHtml(meme.rejection_reason)}
          </div>
        ` : ''}
      </article>
    `).join('');
  }

  async function loadBattleHistory(userId) {
    const container = document.getElementById('battleHistory');

    const { data: votes, error: votesError } = await supabase
      .from('votes')
      .select('id,battle_id,meme_id,bet_amount,payout,settled_at,created_at')
      .eq('user_id', userId)
      .order('created_at', { ascending: false });

    if (votesError) {
      console.error('Ошибка загрузки голосов:', votesError);
      container.innerHTML = '<div class="empty">Не удалось загрузить историю</div>';
      return;
    }

    const voteList = votes || [];

    if (!voteList.length) {
      setStat('battlesCount', 0);
      setStat('coinsWon', 0);
      setStat('coinsLost', 0);
      container.innerHTML = '<div class="empty">Ты пока не участвовал в батлах</div>';
      return;
    }

    const battleIds = [...new Set(voteList.map(vote => vote.battle_id))];

    const { data: battles, error: battlesError } = await supabase
      .from('battles')
      .select('id,meme_a,meme_b,winner_meme_id,status,duration_seconds,created_at')
      .in('id', battleIds);

    if (battlesError) {
      console.error('Ошибка загрузки батлов:', battlesError);
      container.innerHTML = '<div class="empty">Не удалось загрузить историю батлов</div>';
      return;
    }

    const battleMap = new Map((battles || []).map(battle => [battle.id, battle]));

    // В истории оставляем только завершённые батлы.
    const completedVotes = voteList.filter(vote => {
      const battle = battleMap.get(vote.battle_id);
      return battle && battle.status === 'completed';
    });

    const completedBattleIds = new Set(
      completedVotes.map(vote => vote.battle_id)
    );

    setStat('battlesCount', completedBattleIds.size);

    if (!completedVotes.length) {
      setStat('coinsWon', 0);
      setStat('coinsLost', 0);
      container.innerHTML = '<div class="empty">Завершённых батлов пока нет</div>';
      return;
    }

    const memeIds = [
      ...new Set(
        completedVotes.flatMap(vote => {
          const battle = battleMap.get(vote.battle_id);
          return battle ? [battle.meme_a, battle.meme_b] : [];
        }).filter(Boolean)
      )
    ];

    const { data: memes, error: memesError } = await supabase
      .from('memes')
      .select('id,image_url')
      .in('id', memeIds);

    if (memesError) {
      console.error('Ошибка загрузки мемов истории:', memesError);
    }

    const memeMap = new Map(
      (memes || []).map(meme => [meme.id, meme])
    );

    let totalWon = 0;
    let totalLost = 0;

    completedVotes.forEach(vote => {
      if (!vote.settled_at) return;

      const battle = battleMap.get(vote.battle_id);
      if (!battle) return;

      const bet = Number(vote.bet_amount || 0);
      const payout = Number(vote.payout || 0);

      // Ничья: ставка возвращается, изменение баланса — 0.
      if (!battle.winner_meme_id) {
        return;
      }

      // Победа: выплата + ставка.
      if (battle.winner_meme_id === vote.meme_id) {
        totalWon += payout + bet;
      } else {
        // Поражение: потеря ставки.
        totalLost += bet;
      }
    });

    setStat('coinsWon', totalWon);
    setStat('coinsLost', totalLost);

    const history = completedVotes.map(vote => {
      const battle = battleMap.get(vote.battle_id);

      if (!battle) return null;

      const myMeme = memeMap.get(vote.meme_id);

      const opponentId = battle.meme_a === vote.meme_id
        ? battle.meme_b
        : battle.meme_a;

      const opponentMeme = memeMap.get(opponentId);

      let result;
      let resultText;
      let money = 0;
      let moneyClass = 'neutral';

      const bet = Number(vote.bet_amount || 0);
      const payout = Number(vote.payout || 0);

      if (!battle.winner_meme_id) {
        result = 'draw';
        resultText = 'Ничья';
        money = 0;
        moneyClass = 'neutral';
      } else if (battle.winner_meme_id === vote.meme_id) {
        result = 'win';
        resultText = 'Победа';
        money = vote.settled_at ? payout + bet : 0;
        moneyClass = 'positive';
      } else {
        result = 'loss';
        resultText = 'Поражение';
        money = vote.settled_at ? -bet : 0;
        moneyClass = 'negative';
      }

      const moneyText = money > 0
        ? `+${formatNumber(money)}`
        : money < 0
          ? `−${formatNumber(Math.abs(money))}`
          : '0';

      return {
        myImage: myMeme?.image_url || '',
        opponentImage: opponentMeme?.image_url || '',
        date: battle.created_at || vote.created_at,
        result,
        resultText,
        moneyText,
        moneyClass
      };
    }).filter(Boolean);

    container.innerHTML = history.map(item => `
      <article class="history-card">
        <div class="history-images">
          <img
            src="${escapeHtml(item.myImage)}"
            alt="Твой мем"
            loading="lazy"
          >
          <span class="history-vs">VS</span>
          <img
            src="${escapeHtml(item.opponentImage)}"
            alt="Мем соперника"
            loading="lazy"
          >
        </div>

        <div class="history-info">
          <div class="history-opponent">Твой мем против соперника</div>
          <div class="history-date">${escapeHtml(formatDate(item.date))}</div>
          <div class="history-result ${item.result}">
            ${item.resultText}
          </div>
        </div>

        <div class="history-money ${item.moneyClass}">
          ${item.moneyText} 🪙
        </div>
      </article>
    `).join('');
  }

  async function initProfile() {
    if (!supabase) {
      document.getElementById('username').textContent = 'Ошибка подключения';
      return;
    }

    const { data: { user }, error: authError } = await supabase.auth.getUser();

    if (authError || !user) {
      window.location.href = 'login.html';
      return;
    }

    document.getElementById('email').textContent = user.email || '';

    const { data: profile, error: profileError } = await supabase
      .from('profiles')
      .select('username,coins')
      .eq('id', user.id)
      .single();

    if (profileError) {
      console.error('Ошибка загрузки профиля:', profileError);
    }

    const username = profile?.username || 'Игрок';

    document.getElementById('username').textContent = username;
    document.getElementById('headerUsername').textContent = username;
    document.getElementById('avatar').textContent =
      username.charAt(0).toUpperCase();

    setStat('balanceStat', profile?.coins || 0);

    await Promise.all([
      loadMyMemes(user.id),
      loadBattleHistory(user.id)
    ]);
  }

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.href = 'login.html';
  });

  initProfile();
</script>

</body>
</html>
