<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мем Битва – Профиль</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* История битв: одинаковый аккуратный размер превью независимо от исходного размера мема */
    .battle-history-item {
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }

    .battle-history-memes {
      display: grid !important;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      width: 100%;
    }

    .history-meme {
      min-width: 0;
      width: 100%;
      overflow: hidden;
    }

    .history-meme-image {
      display: block;
      width: 100% !important;
      height: 280px !important;
      max-width: 100%;
      object-fit: contain !important;
      object-position: center;
      background: #f4f6f8;
      border-radius: 10px;
    }

    @media (max-width: 700px) {
      .battle-history-memes {
        grid-template-columns: 1fr;
      }

      .history-meme-image {
        height: 240px !important;
      }
    }
  </style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo">
      <h1>⚡ Мем Битва</h1>
    </div>
    <div style="display:flex; align-items:center; gap:16px;">
      <div class="balance-box balance-loading" id="headerBalance">🪙 —</div>
      <button id="logoutBtn" style="background:#cc3333; border:none; padding:6px 16px; border-radius:40px; font-weight:700; color:#fff; cursor:pointer;">Выйти</button>
    </div>
  </header>

  <div class="tabs">
    <a href="index.html" class="tab-btn">🏆 Битвы</a>
    <a href="profile.html" class="tab-btn active">👤 Профиль</a>
    <a href="top.html" class="tab-btn">📊 Топ</a>
    <a href="submit.html" class="tab-btn">📤 Отправить мем</a>
    <a href="admin.html" class="tab-btn" id="adminTab">🛡️ Админ</a>
  </div>

  <div class="profile-card">
    <h2>👤 Игрок: <span id="profileLogin"></span></h2>
    <div class="balance-big balance-loading" id="profileBalance">🪙 —</div>
    <h3 class="history-section-title">История битв</h3>
    <div id="battleHistoryList" class="battle-history"><p class="history-empty">Пока вы не участвовали в битвах</p></div>

    <h3 class="history-section-title">История операций</h3>
    <div class="history" id="historyList"><p style="color:#666;">Пока нет операций</p></div>
  </div>
</div>

<script src="common.js"></script>
<script>
(async()=>{
  const user=await requireAuth(); if(!user)return;
  document.getElementById('profileLogin').textContent=user.login;
  const profileBalance=document.getElementById('profileBalance');
  profileBalance.textContent=`🪙 ${Number(user.balance)}`;
  profileBalance.classList.remove('balance-loading');
  renderHistory(user.history);

  const historyContainer=document.getElementById('battleHistoryList');
  const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  const memeUrl=value=>{const s=String(value??'');return /^(https?:|data:|blob:|\/)/i.test(s)?s:'./'+s.replace(/^\.\//,'');};
  const resultText={win:'🏆 Победа',loss:'❌ Поражение',tie:'🤝 Ничья'};

  function renderBattleHistory(items){
    if(!items?.length){
      historyContainer.innerHTML='<p class="history-empty">Пока вы не участвовали в битвах</p>';
      return;
    }
    historyContainer.innerHTML=items.map((item,index)=>{
      const selected=item.votedPath;
      const result=resultText[item.result]||'—';
      const date=item.endedAt ? new Date(item.endedAt).toLocaleString('ru-RU') : '';
      const meme1=escapeHtml(memeUrl(item.meme1));
      const meme2=escapeHtml(memeUrl(item.meme2));
      const selected1=selected===item.meme1;
      const selected2=selected===item.meme2;
      const winner= item.winnerPath ? (item.winnerPath===item.meme1 ? 'Мем 1' : 'Мем 2') : 'Ничья';
      return `
        <article class="battle-history-item">
          <div class="battle-history-head">
            <strong>⚔️ Битва #${items.length-index}</strong>
            <span class="battle-result">${result}</span>
            <span class="battle-date">${escapeHtml(date)}</span>
          </div>
          <div class="battle-history-memes">
            <div class="history-meme ${selected1?'selected':''}">
              ${selected1?'<div class="history-choice">ВАШ ВЫБОР</div>':''}
              <img src="${meme1}" alt="Мем 1" class="history-meme-image">
              <div class="history-meme-caption">Мем 1 · ${item.votes1??0} голосов</div>
            </div>
            <div class="history-meme ${selected2?'selected':''}">
              ${selected2?'<div class="history-choice">ВАШ ВЫБОР</div>':''}
              <img src="${meme2}" alt="Мем 2" class="history-meme-image">
              <div class="history-meme-caption">Мем 2 · ${item.votes2??0} голосов</div>
            </div>
          </div>
          <div class="battle-history-summary">Ваш выбор: <b>${selected1?'Мем 1':'Мем 2'}</b> · Исход: <b>${result}</b> · Победил: <b>${winner}</b></div>
        </article>`;
    }).join('');
  }

  renderBattleHistory(user.battleHistory);
  document.getElementById('logoutBtn').onclick=async()=>{await logoutUser();location.href='login.html'};
})();
</script>
</body>
</html>
