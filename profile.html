
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mem Battle — Профиль</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f2f6ff;
      color: #172b4d;
      font-family: 'Inter', Arial, sans-serif;
    }

    button, a {
      font: inherit;
    }

    /* Шапка в стиле главной страницы */

    header {
      min-height: 105px;
      background: white;
      border-bottom: 2px solid #dce7ff;
      padding: 20px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
      flex-wrap: wrap;
    }

    .left-side {
      display: flex;
      flex-direction: column;
    }

    .logo {
      font-family: 'Russo One', sans-serif;
      font-size: 32px;
      text-decoration: none;
      color: #1769e0;
      letter-spacing: 1px;
    }

    .logo span {
      color: #e53945;
    }

    .navigation {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .navigation a {
      text-decoration: none;
      color: #31517e;
      background: #f2f6ff;
      padding: 11px 17px;
      border-radius: 9px;
      font-weight: 700;
      font-size: 14px;
      transition: 0.2s;
    }

    .navigation a:hover,
    .navigation a.active {
      background: #1769e0;
      color: white;
    }

    .right-side {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .user-info {
      text-align: right;
    }

    .header-username {
      font-weight: 800;
      font-size: 16px;
      color: #1769e0;
    }

    .logout {
      border: none;
      background: #e53945;
      color: white;
      padding: 12px 19px;
      border-radius: 9px;
      font-weight: 700;
      cursor: pointer;
    }

    .logout:hover {
      background: #c62835;
    }

    /* Основная часть */

    .container {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 20px 50px;
    }

    .profile-card {
      background: white;
      border: 2px solid #dce7ff;
      border-radius: 18px;
      padding: 25px;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: 0 7px 25px rgba(30, 80, 160, 0.06);
      margin-bottom: 22px;
    }

    .avatar {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #1769e0;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Russo One', sans-serif;
      font-size: 30px;
      flex-shrink: 0;
    }

    .profile-info {
      min-width: 0;
    }

    .profile-info h1 {
      margin: 0 0 6px;
      font-family: 'Russo One', sans-serif;
      font-size: 25px;
      overflow-wrap: anywhere;
    }

    .profile-info p {
      margin: 0;
      color: #8290a8;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .balance {
      margin-left: auto;
      text-align: right;
      flex-shrink: 0;
    }

    .balance-label {
      color: #8290a8;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .balance-value {
      color: #1769e0;
      font-family: 'Russo One', sans-serif;
      font-size: 25px;
    }

    /* Статистика */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      border: 2px solid #dce7ff;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 7px 25px rgba(30, 80, 160, 0.04);
      min-width: 0;
    }

    .stat-label {
      color: #8290a8;
      font-size: 13px;
      margin-bottom: 9px;
      font-weight: 600;
    }

    .stat-value {
      font-family: 'Russo One', sans-serif;
      font-size: 25px;
      color: #1769e0;
      overflow-wrap: anywhere;
    }

    .stat-value.green {
      color: #16a36a;
    }

    .stat-value.red {
      color: #e53945;
    }

    /* Разделы */

    .section {
      margin-top: 32px;
    }

    .section-title {
      font-family: 'Russo One', sans-serif;
      font-size: 22px;
      color: #1769e0;
      margin: 0 0 17px;
      padding-bottom: 12px;
      border-bottom: 2px solid #dce7ff;
    }

    /* Мои мемы */

    .memes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 16px;
    }

    .meme-card {
      background: white;
      border: 2px solid #dce7ff;
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 4px 15px rgba(30, 60, 100, 0.05);
      min-width: 0;
    }

    .meme-card img {
      width: 100%;
      height: 190px;
      object-fit: contain;
      background: #f4f6fa;
      border-radius: 9px;
      display: block;
    }

    .meme-info {
      padding: 10px 2px 2px;
      font-size: 13px;
      color: #65728a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status {
      font-weight: 700;
    }

    .status.approved {
      color: #16a36a;
    }

    .status.pending {
      color: #d99516;
    }

    .status.rejected {
      color: #e53945;
    }

    /* История батлов */

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .history-card {
      background: white;
      border: 2px solid #dce7ff;
      border-radius: 14px;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 4px 15px rgba(30, 60, 100, 0.05);
      min-width: 0;
    }

    .history-images {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .history-images img {
      width: 76px;
      height: 76px;
      object-fit: contain;
      background: #f4f6fa;
      border-radius: 9px;
    }

    .history-vs {
      color: #9aa5b7;
      font-family: 'Russo One', sans-serif;
      font-size: 12px;
    }

    .history-info {
      flex: 1;
      min-width: 0;
    }

    .history-opponent {
      font-weight: 800;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .history-date {
      color: #8995a9;
      font-size: 12px;
      margin-bottom: 7px;
    }

    .history-result {
      font-size: 13px;
      font-weight: 800;
    }

    .history-result.win {
      color: #16a36a;
    }

    .history-result.loss {
      color: #e53945;
    }

    .history-result.draw {
      color: #8995a9;
    }

    .history-money {
      font-family: 'Russo One', sans-serif;
      font-size: 17px;
      white-space: nowrap;
      margin-left: auto;
    }

    .history-money.positive {
      color: #16a36a;
    }

    .history-money.negative {
      color: #e53945;
    }

    .history-money.neutral {
      color: #8995a9;
    }

    .history-more {
      display: block;
      margin: 18px auto 0;
      padding: 13px 25px;
      border: none;
      border-radius: 10px;
      background: #1769e0;
      color: white;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
    }

    .history-more:hover {
      background: #0d50b5;
    }

    .history-more:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .history-more[hidden] {
      display: none;
    }

    /* Сообщения */

    .empty {
      background: white;
      border: 2px dashed #dce7ff;
      padding: 28px 18px;
      border-radius: 14px;
      color: #8995a9;
      text-align: center;
      font-size: 14px;
      grid-column: 1 / -1;
    }

    .loading {
      color: #8995a9;
      text-align: center;
      padding: 25px;
      grid-column: 1 / -1;
    }

    /* Адаптация */

    @media (max-width: 850px) {
      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 550px) {
      header {
        align-items: flex-start;
        padding: 16px;
      }

      .logo {
        font-size: 26px;
      }

      .navigation {
        gap: 7px;
      }

      .navigation a {
        padding: 9px 10px;
        font-size: 12px;
      }

      .right-side {
        width: 100%;
        justify-content: space-between;
      }

      .container {
        margin-top: 22px;
        padding: 0 12px 35px;
      }

      .profile-card {
        padding: 15px;
        gap: 11px;
      }

      .avatar {
        width: 55px;
        height: 55px;
        font-size: 22px;
      }

      .profile-info h1 {
        font-size: 18px;
      }

      .profile-info p {
        font-size: 11px;
      }

      .balance-value {
        font-size: 18px;
      }

      .balance-label {
        font-size: 11px;
      }

      .stats {
        gap: 10px;
      }

      .stat-card {
        padding: 14px;
      }

      .stat-label {
        font-size: 11px;
      }

      .stat-value {
        font-size: 20px;
      }

      .section-title {
        font-size: 19px;
      }

      .history-card {
        padding: 9px;
        gap: 8px;
      }

      .history-images {
        gap: 4px;
      }

      .history-images img {
        width: 48px;
        height: 55px;
      }

      .history-vs {
        font-size: 9px;
      }

      .history-opponent {
        font-size: 11px;
      }

      .history-date {
        font-size: 10px;
      }

      .history-result {
        font-size: 11px;
      }

      .history-money {
        font-size: 12px;
      }
    }

    @media (max-width: 370px) {
      .profile-card {
        flex-wrap: wrap;
      }

      .balance {
        width: 100%;
        text-align: left;
        margin-left: 66px;
      }

      .history-images img {
        width: 40px;
        height: 48px;
      }

      .history-money {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="left-side">
    <a href="index.html" class="logo">MEM <span>BATTLE</span></a>

    <nav class="navigation">
      <a href="index.html">Главная</a>
      <a href="profile.html" class="active">Профиль</a>
      <a href="submit.html">Отправить мем</a>
      <a href="top.html">Топ</a>
    </nav>
  </div>

  <div class="right-side">
    <div class="user-info">
      <div class="header-username" id="headerUsername">Загрузка...</div>
    </div>

    <button class="logout" id="logoutBtn">Выйти</button>
  </div>
</header>

<main class="container">

  <section class="profile-card">
    <div class="avatar" id="avatar">?</div>

    <div class="profile-info">
      <h1 id="username">Загрузка...</h1>
      <p id="email"></p>
    </div>

    <div class="balance">
      <div class="balance-label">Баланс</div>
      <div class="balance-value" id="balanceStat">0</div>
    </div>
  </section>

  <section class="stats">

    <div class="stat-card">
      <div class="stat-label">Моих мемов загружено</div>
      <div class="stat-value" id="memesCount">0</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">Победы моих мемов</div>
      <div class="stat-value green" id="winsCount">0</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">Сыграно батлов</div>
      <div class="stat-value" id="battlesCount">0</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">Выиграно монет</div>
      <div class="stat-value green" id="coinsWon">0</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">Проиграно монет</div>
      <div class="stat-value red" id="coinsLost">0</div>
    </div>

  </section>

  <section class="section">
    <h2 class="section-title">Мои мемы</h2>

    <div class="memes-grid" id="myMemes">
      <div class="loading">Загрузка мемов...</div>
    </div>
  </section>

  <section class="section">
    <h2 class="section-title">История батлов</h2>

    <div class="history-list" id="battleHistory">
      <div class="loading">Загрузка истории...</div>
    </div>

    <button
      id="loadMoreHistoryBtn"
      class="history-more"
      hidden
    >
      Показать ещё 10
    </button>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
  // Используем отдельное имя, чтобы не конфликтовать
  // с глобальным объектом supabase из CDN.
  const db = window.supabaseClient;

  // Настройки истории.
  const HISTORY_BATCH_SIZE = 50;
  const HISTORY_DISPLAY_SIZE = 10;

  let historyOffset = 0;
  let historyQueue = [];
  let historyHasMore = true;
  let historyLoading = false;
  let currentUserId = null;

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#039;'
    })[char]);
  }

  function formatNumber(value) {
    return Number(value || 0).toLocaleString('ru-RU');
  }

  function formatDate(value) {
    if (!value) return 'Дата неизвестна';

    return new Date(value).toLocaleString('ru-RU', {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });
  }

  function setStat(id, value) {
    const element = document.getElementById(id);

    if (element) {
      element.textContent = formatNumber(value);
    }
  }

  function getStatusName(status) {
    const statuses = {
      approved: 'Одобрен',
      pending: 'На модерации',
      rejected: 'Отклонён'
    };

    return statuses[status] || status || 'Неизвестно';
  }

  function getStatusClass(status) {
    if (status === 'approved') return 'approved';
    if (status === 'rejected') return 'rejected';

    return 'pending';
  }

  // Загрузка мемов пользователя.
  async function loadMyMemes(userId) {
    const container = document.getElementById('myMemes');

    try {
      const { data: memes, error } = await db
        .from('memes')
        .select('id,image_url,wins,status,created_at,rejection_reason')
        .eq('user_id', userId)
        .order('created_at', { ascending: false });

      if (error) throw error;

      const memeList = memes || [];

      setStat('memesCount', memeList.length);

      const totalWins = memeList.reduce(
        (sum, meme) => sum + Number(meme.wins || 0),
        0
      );

      setStat('winsCount', totalWins);

      if (!memeList.length) {
        container.innerHTML =
          '<div class="empty">Ты пока не загрузил ни одного мема</div>';
        return;
      }

      container.innerHTML = memeList.map(meme => `
        <article class="meme-card">
          <img
            src="${escapeHtml(meme.image_url)}"
            alt="Мем"
            loading="lazy"
          >

          <div class="meme-info">
            <span>Побед: ${formatNumber(meme.wins)}</span>

            <span class="status ${getStatusClass(meme.status)}">
              ${escapeHtml(getStatusName(meme.status))}
            </span>
          </div>

          ${meme.rejection_reason ? `
            <div style="font-size:12px;color:#e53945;padding:5px 2px;">
              Причина: ${escapeHtml(meme.rejection_reason)}
            </div>
          ` : ''}
        </article>
      `).join('');

    } catch (error) {
      console.error('Ошибка загрузки мемов:', error);

      container.innerHTML =
        '<div class="empty">Не удалось загрузить мемы</div>';
    }
  }

  // Загрузка одной порции голосов и связанных с ними батлов.
  async function fetchHistoryBatch(userId) {
    const start = historyOffset;
    const end = start + HISTORY_BATCH_SIZE - 1;

    const { data: votes, error: votesError } = await db
      .from('votes')
      .select('id,battle_id,meme_id,bet_amount,payout,settled_at,created_at')
      .eq('user_id', userId)
      .order('created_at', { ascending: false })
      .range(start, end);

    if (votesError) throw votesError;

    const voteList = votes || [];

    if (!voteList.length) {
      historyHasMore = false;
      return;
    }

    const battleIds = [
      ...new Set(voteList.map(vote => vote.battle_id))
    ];

    const { data: battles, error: battlesError } = await db
      .from('battles')
      .select('id,meme_a,meme_b,winner_meme_id,status,created_at')
      .in('id', battleIds);

    if (battlesError) throw battlesError;

    const battleMap = new Map(
      (battles || []).map(battle => [battle.id, battle])
    );

    // Незавершённые батлы в историю не попадают.
    const completedVotes = voteList.filter(vote => {
      const battle = battleMap.get(vote.battle_id);
      return battle && battle.status === 'completed';
    });

    let items = [];

    if (completedVotes.length) {
      const memeIds = [
        ...new Set(
          completedVotes.flatMap(vote => {
            const battle = battleMap.get(vote.battle_id);

            return battle
              ? [battle.meme_a, battle.meme_b]
              : [];
          }).filter(Boolean)
        )
      ];

      const { data: memes, error: memesError } = await db
        .from('memes')
        .select('id,image_url')
        .in('id', memeIds);

      if (memesError) throw memesError;

      const memeMap = new Map(
        (memes || []).map(meme => [meme.id, meme])
      );

      items = completedVotes.map(vote => {
        const battle = battleMap.get(vote.battle_id);

        const myMeme = memeMap.get(vote.meme_id);

        const opponentId = battle.meme_a === vote.meme_id
          ? battle.meme_b
          : battle.meme_a;

        const opponentMeme = memeMap.get(opponentId);

        const bet = Number(vote.bet_amount || 0);
        const payout = Number(vote.payout || 0);

        let result;
        let resultText;
        let money = 0;
        let moneyClass = 'neutral';

        if (!battle.winner_meme_id) {
          result = 'draw';
          resultText = 'Ничья';
          money = 0;
          moneyClass = 'neutral';

        } else if (battle.winner_meme_id === vote.meme_id) {
          result = 'win';
          resultText = 'Победа';

          if (vote.settled_at) {
            money = payout + bet;
          }

          moneyClass = 'positive';

        } else {
          result = 'loss';
          resultText = 'Поражение';

          if (vote.settled_at) {
            money = -bet;
          }

          moneyClass = 'negative';
        }

        const moneyText = money > 0
          ? `+${formatNumber(money)}`
          : money < 0
            ? `−${formatNumber(Math.abs(money))}`
            : '0';

        return {
          myImage: myMeme?.image_url || '',
          opponentImage: opponentMeme?.image_url || '',
          date: battle.created_at || vote.created_at,
          result,
          resultText,
          moneyText,
          moneyClass
        };
      });
    }

    // Смещаем указатель только после успешной обработки порции.
    historyOffset += voteList.length;

    if (voteList.length < HISTORY_BATCH_SIZE) {
      historyHasMore = false;
    }

    historyQueue.push(...items);
  }

  // Добавление одной записи истории.
  function renderHistoryItem(item) {
    const container = document.getElementById('battleHistory');

    const card = document.createElement('article');
    card.className = 'history-card';

    card.innerHTML = `
      <div class="history-images">
        <img
          src="${escapeHtml(item.myImage)}"
          alt="Твой мем"
          loading="lazy"
        >

        <span class="history-vs">VS</span>

        <img
          src="${escapeHtml(item.opponentImage)}"
          alt="Мем соперника"
          loading="lazy"
        >
      </div>

      <div class="history-info">
        <div class="history-opponent">
          Твой мем против соперника
        </div>

        <div class="history-date">
          ${escapeHtml(formatDate(item.date))}
        </div>

        <div class="history-result ${item.result}">
          ${item.resultText}
        </div>
      </div>

      <div class="history-money ${item.moneyClass}">
        ${item.moneyText} 🪙
      </div>
    `;

    container.appendChild(card);
  }

  // Первоначальная загрузка истории.
  async function loadBattleHistory(userId) {
    const container = document.getElementById('battleHistory');
    const button = document.getElementById('loadMoreHistoryBtn');

    historyOffset = 0;
    historyQueue = [];
    historyHasMore = true;
    historyLoading = false;

    container.innerHTML = '';
    button.hidden = true;

    await loadMoreHistory(userId);
  }

  // Показ следующих 10 записей.
  async function loadMoreHistory(userId) {
    if (historyLoading) return;

    historyLoading = true;

    const button = document.getElementById('loadMoreHistoryBtn');
    const container = document.getElementById('battleHistory');

    button.hidden = false;
    button.disabled = true;
    button.textContent = 'Загружаем...';

    try {
      // Загружаем следующие порции, пока не наберём
      // 10 завершённых батлов или пока история не закончится.
      while (
        historyQueue.length < HISTORY_DISPLAY_SIZE &&
        historyHasMore
      ) {
        await fetchHistoryBatch(userId);
      }

      const nextItems = historyQueue.splice(
        0,
        HISTORY_DISPLAY_SIZE
      );

      nextItems.forEach(renderHistoryItem);

      if (
        container.children.length === 0 &&
        !historyHasMore &&
        historyQueue.length === 0
      ) {
        container.innerHTML =
          '<div class="empty">Ты пока не участвовал в завершённых батлах</div>';
      }

      const canLoadMore =
        historyQueue.length > 0 || historyHasMore;

      button.hidden = !canLoadMore;
      button.disabled = false;
      button.textContent = 'Показать ещё 10';

    } catch (error) {
      console.error('Ошибка загрузки истории:', error);

      if (container.children.length === 0) {
        container.innerHTML =
          '<div class="empty">Не удалось загрузить историю. Нажми кнопку, чтобы повторить.</div>';
      }

      button.hidden = false;
      button.disabled = false;
      button.textContent = 'Повторить загрузку';

    } finally {
      historyLoading = false;
    }
  }

  // Общая статистика за всё время.
  async function loadBattleStats() {
    try {
      const { data, error } = await db.rpc('get_my_battle_stats');

      if (error) throw error;

      const stats = data?.[0];

      if (!stats) return;

      setStat('battlesCount', stats.battles_count);
      setStat('coinsWon', stats.coins_won);
      setStat('coinsLost', stats.coins_lost);

    } catch (error) {
      console.error('Ошибка статистики батлов:', error);
    }
  }

  // Инициализация профиля.
  async function initProfile() {
    const usernameElement = document.getElementById('username');
    const headerUsernameElement = document.getElementById('headerUsername');

    if (!db) {
      usernameElement.textContent = 'Ошибка подключения';
      document.getElementById('myMemes').innerHTML =
        '<div class="empty">Не найдено подключение к Supabase</div>';
      document.getElementById('battleHistory').innerHTML =
        '<div class="empty">Не найдено подключение к Supabase</div>';
      console.error('window.supabaseClient не найден. Проверь supabase.js.');
      return;
    }

    try {
      const {
        data: { session },
        error: authError
      } = await db.auth.getSession();

      if (authError) throw authError;

      const user = session?.user;

      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      currentUserId = user.id;

      document.getElementById('email').textContent =
        user.email || '';

      // Загружаем профиль, мемы, историю и статистику параллельно.
      const [
        profileResult
      ] = await Promise.all([
        db
          .from('profiles')
          .select('username,coins')
          .eq('id', user.id)
          .single(),

        loadMyMemes(user.id),

        loadBattleHistory(user.id),

        loadBattleStats()
      ]);

      const { data: profile, error: profileError } = profileResult;

      if (profileError) {
        console.error('Ошибка загрузки профиля:', profileError);
      }

      const username = profile?.username || 'Игрок';

      usernameElement.textContent = username;
      headerUsernameElement.textContent = username;

      document.getElementById('avatar').textContent =
        username.charAt(0).toUpperCase();

      setStat('balanceStat', profile?.coins || 0);

    } catch (error) {
      console.error('Ошибка инициализации профиля:', error);

      usernameElement.textContent = 'Ошибка загрузки';

      document.getElementById('myMemes').innerHTML =
        '<div class="empty">Не удалось загрузить профиль. Проверь подключение и обнови страницу.</div>';

      document.getElementById('battleHistory').innerHTML =
        '<div class="empty">Не удалось загрузить историю.</div>';
    }
  }

  // Кнопка выхода.
  document.getElementById('logoutBtn').addEventListener(
    'click',
    async () => {
      if (!db) return;

      const { error } = await db.auth.signOut();

      if (error) {
        alert('Не удалось выйти: ' + error.message);
        return;
      }

      window.location.href = 'login.html';
    }
  );

  // Кнопка следующей порции истории.
  document
    .getElementById('loadMoreHistoryBtn')
    .addEventListener('click', async () => {
      if (currentUserId) {
        await loadMoreHistory(currentUserId);
      }
    });

  initProfile();
</script>

</body>
</html>
