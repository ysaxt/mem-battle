
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — MEM BATTLE</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Russo+One&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #f2f6ff;
            color: #172b4d;
            font-family: 'Inter', sans-serif;
        }

        header {
            background: white;
            border-bottom: 2px solid #dce7ff;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .left-side, .right-side, .navigation {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .logo {
            font-family: 'Russo One', sans-serif;
            font-size: 30px;
            color: #1769e0;
            white-space: nowrap;
        }

        .logo span { color: #e53945; }

        .navigation a {
            text-decoration: none;
            color: #71809b;
            font-weight: 700;
            transition: .2s;
        }

        .navigation a:hover,
        .navigation a.active {
            color: #1769e0;
        }

        .user-info {
            text-align: right;
            font-size: 13px;
            color: #71809b;
        }

        .user-info strong {
            display: block;
            color: #172b4d;
            font-size: 15px;
        }

        button, .button {
            border: none;
            background: #1769e0;
            color: white;
            padding: 11px 18px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }

        button:hover, .button:hover { background: #0e55bd; }

        .logout { background: #e53945; }

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            font-family: 'Russo One', sans-serif;
            font-size: 32px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            border: 2px solid #dce7ff;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 5px 18px rgba(23, 105, 224, .05);
        }

        .profile-top {
            display: flex;
            align-items: center;
            gap: 22px;
            flex-wrap: wrap;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #e5efff;
            color: #1769e0;
            display: grid;
            place-items: center;
            font-size: 35px;
            font-weight: 800;
        }

        .profile-name {
            font-size: 25px;
            font-weight: 800;
        }

        .muted { color: #71809b; }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 25px;
        }

        .stat {
            background: #f2f6ff;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat strong {
            display: block;
            color: #1769e0;
            font-size: 25px;
            margin-bottom: 5px;
        }

        .items {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
        }

        .meme {
            border: 2px solid #dce7ff;
            border-radius: 14px;
            overflow: hidden;
            background: white;
        }

        .meme img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .meme-info { padding: 14px; }

        .empty {
            color: #71809b;
            text-align: center;
            padding: 25px;
        }

        @media(max-width: 700px) {
            header { justify-content: center; }
            .left-side { flex-direction: column; gap: 15px; }
            .navigation { gap: 12px; flex-wrap: wrap; justify-content: center; }
            .right-side { justify-content: center; }
            .stats { grid-template-columns: 1fr; }
            h1 { font-size: 25px; }
        }
    </style>
</head>

<body>

<header>
    <div class="left-side">
        <div class="logo">MEM <span>BATTLE</span></div>

        <nav class="navigation">
            <a href="index.html">Главная</a>
            <a href="profile.html" class="active">Профиль</a>
            <a href="submit.html">Отправить мем</a>
            <a href="top.html">Топ</a>
        </nav>
    </div>

    <div class="right-side">
        <div class="user-info">
            <strong id="username">Загрузка...</strong>
            <span>Баланс: <b id="balance">0</b> 🪙</span>
        </div>
        <button class="logout" id="logoutBtn">Выйти</button>
    </div>
</header>

<main>
    <h1>Мой профиль</h1>

    <section class="card">
        <div class="profile-top">
            <div class="avatar" id="avatar">👤</div>
            <div>
                <div class="profile-name" id="profileName">Загрузка...</div>
                <div class="muted" id="profileEmail"></div>
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <strong id="balanceStat">0</strong>
                Баланс
            </div>
            <div class="stat">
                <strong id="memesCount">0</strong>
                Мемов
            </div>
            <div class="stat">
                <strong id="winsCount">0</strong>
                Побед
            </div>
        </div>
    </section>

    <section class="card">
        <h2>Мои мемы</h2>
        <div class="items" id="myMemes">
            <p class="empty">Загрузка мемов...</p>
        </div>
    </section>
</main>

<script>
    const db = window.supabaseClient || window.supabase;

    async function initProfile() {
        if (!db) {
            alert('Не найден клиент Supabase. Проверь supabaseClient.js');
            return;
        }

        const { data: { user }, error } = await db.auth.getUser();

        if (error || !user) {
            location.href = 'index.html';
            return;
        }

        document.getElementById('profileEmail').textContent = user.email || '';

        const { data: profile } = await db
            .from('profiles')
            .select('*')
            .eq('id', user.id)
            .maybeSingle();

        const name = profile?.username || user.email?.split('@')[0] || 'Игрок';
        const balance = profile?.balance ?? 0;

        document.getElementById('username').textContent = name;
        document.getElementById('profileName').textContent = name;
        document.getElementById('balance').textContent = balance;
        document.getElementById('balanceStat').textContent = balance;
        document.getElementById('avatar').textContent = name[0].toUpperCase();

        const { data: memes, error: memesError } = await db
            .from('memes')
            .select('*')
            .eq('user_id', user.id)
            .order('created_at', { ascending: false });

        const container = document.getElementById('myMemes');

        if (memesError) {
            container.innerHTML = '<p class="empty">Не удалось загрузить мемы.</p>';
            return;
        }

        document.getElementById('memesCount').textContent = memes?.length || 0;

        if (!memes || memes.length === 0) {
            container.innerHTML = '<p class="empty">Ты пока не отправил ни одного мема.</p>';
            return;
        }

        container.innerHTML = memes.map(meme => {
            const image = meme.image_url || meme.image || meme.url;

            return `
                <article class="meme">
                    ${image ? `<img src="${escapeHtml(image)}" alt="Мем">` : ''}
                    <div class="meme-info">
                        <strong>${escapeHtml(meme.title || 'Мой мем')}</strong>
                    </div>
                </article>
            `;
        }).join('');
    }

    function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, char => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;',
            '"': '&quot;', "'": '&#039;'
        })[char]);
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
        if (db) await db.auth.signOut();
        location.href = 'index.html';
    });

    initProfile();
</script>

</body>
</html>
