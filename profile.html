
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мем Битва — Профиль</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Russo+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f4f8ff;
      color: #17233d;
      font-family: 'Inter', sans-serif;
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      padding: 18px 22px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 18px rgba(30,70,130,.07);
    }

    .logo {
      font-family: 'Russo One', sans-serif;
      font-size: 25px;
      color: #246bdb;
      text-decoration: none;
    }

    .nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav a {
      text-decoration: none;
      color: #53627b;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 10px;
    }

    .nav a:hover, .nav a.active {
      color: #246bdb;
      background: #eaf2ff;
    }

    .page-title {
      margin: 35px 0 20px;
      font-family: 'Russo One', sans-serif;
      font-size: 30px;
    }

    .profile-card, .memes-box {
      background: white;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 5px 22px rgba(30,70,130,.07);
      margin-bottom: 20px;
    }

    .profile-top {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .avatar {
      width: 78px;
      height: 78px;
      border-radius: 20px;
      background: linear-gradient(135deg, #2f80ed, #70b7ff);
      color: white;
      display: grid;
      place-items: center;
      font-family: 'Russo One', sans-serif;
      font-size: 32px;
    }

    .username {
      font-family: 'Russo One', sans-serif;
      font-size: 25px;
      margin: 0 0 7px;
    }

    .user-role {
      color: #8290a8;
      font-size: 13px;
      font-weight: 700;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 25px;
    }

    .stat {
      padding: 20px;
      background: #f4f8ff;
      border-radius: 15px;
    }

    .stat-label {
      color: #77869e;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .stat-value {
      font-family: 'Russo One', sans-serif;
      font-size: 27px;
      color: #246bdb;
    }

    .section-title {
      font-family: 'Russo One', sans-serif;
      font-size: 21px;
      margin: 28px 0 15px;
    }

    .meme-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid #edf1f7;
    }

    .meme-item:last-child {
      border-bottom: none;
    }

    .meme-image {
      width: 110px;
      height: 90px;
      object-fit: contain;
      border-radius: 10px;
      background: #edf3fc;
      flex-shrink: 0;
    }

    .meme-details {
      min-width: 0;
      flex: 1;
    }

    .status {
      display: inline-block;
      padding: 7px 11px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
    }

    .status-pending {
      color: #a66a00;
      background: #fff5dc;
    }

    .status-approved {
      color: #16834d;
      background: #eafff2;
      border: 1px solid #b8efd0;
    }

    .status-rejected {
      color: #d83c3c;
      background: #fff0f0;
      border: 1px solid #ffd0d0;
    }

    .meme-wins {
      color: #8290a8;
      font-size: 13px;
      margin-top: 8px;
    }

    .rejection-reason {
      color: #d83c3c;
      background: #fff4f4;
      border-radius: 9px;
      padding: 10px;
      margin-top: 9px;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .empty {
      color: #8996aa;
      text-align: center;
      padding: 25px 10px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    .btn {
      display: inline-block;
      border: none;
      border-radius: 11px;
      padding: 12px 18px;
      background: #246bdb;
      color: white;
      text-decoration: none;
      font-weight: 800;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-red { background: #ed5353; }

    .message {
      margin-top: 15px;
      color: #ed5353;
      font-weight: 600;
    }

    @media (max-width: 650px) {
      .app { padding: 12px; }
      .header { padding: 15px; }
      .stats { grid-template-columns: 1fr; }
      .page-title { font-size: 25px; }
      .profile-card, .memes-box { padding: 20px; }
      .meme-image { width: 85px; height: 75px; }
    }
  </style>
</head>

<body>
<div class="app">

  <header class="header">
    <a href="index.html" class="logo">МЕМ БИТВА</a>

    <nav class="nav">
      <a href="index.html">Битвы</a>
      <a href="submit.html">Отправить мем</a>
      <a href="top.html">Топ</a>
      <a href="profile.html" class="active">Профиль</a>
    </nav>
  </header>

  <h1 class="page-title">Мой профиль</h1>

  <section class="profile-card">
    <div class="profile-top">
      <div class="avatar" id="avatar">?</div>

      <div>
        <h2 class="username" id="username">Загрузка...</h2>
        <div class="user-role" id="userRole">Участник Мем Битвы</div>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">Баланс</div>
        <div class="stat-value" id="coins">—</div>
      </div>

      <div class="stat">
        <div class="stat-label">Отправлено мемов</div>
        <div class="stat-value" id="memesCount">—</div>
      </div>

      <div class="stat">
        <div class="stat-label">Победы мемов</div>
        <div class="stat-value" id="wins">—</div>
      </div>
    </div>

    <div class="buttons">
      <a href="submit.html" class="btn">Отправить мем</a>
      <button class="btn btn-red" id="logoutBtn">Выйти из аккаунта</button>
    </div>

    <div class="message" id="message"></div>
  </section>

  <h2 class="section-title">Мои мемы</h2>

  <section class="memes-box">
    <div class="empty" id="myMemes">Загрузка мемов...</div>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
  const message = document.getElementById('message');

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#039;'
    })[char]);
  }

  async function loadProfile() {
    const { data: authData, error: authError } =
      await supabaseClient.auth.getUser();

    if (authError || !authData.user) {
      message.textContent = 'Войди в аккаунт, чтобы посмотреть профиль.';
      document.getElementById('username').textContent = 'Гость';
      document.getElementById('myMemes').textContent =
        'Войди в аккаунт, чтобы увидеть свои мемы.';
      return;
    }

    const user = authData.user;

    const { data: profile, error: profileError } = await supabaseClient
      .from('profiles')
      .select('username, coins, role')
      .eq('id', user.id)
      .single();

    if (profileError || !profile) {
      message.textContent = 'Не удалось загрузить профиль.';
      return;
    }

    document.getElementById('username').textContent =
      profile.username || 'Игрок';

    document.getElementById('avatar').textContent =
      (profile.username || '?').charAt(0).toUpperCase();

    document.getElementById('coins').textContent =
      profile.coins ?? 0;

    document.getElementById('userRole').textContent =
      profile.role === 'admin' ? 'Администратор' : 'Участник Мем Битвы';

    const { data: memes, error: memesError } = await supabaseClient
      .from('memes')
      .select('id, image_url, status, wins, created_at, rejection_reason')
      .eq('user_id', user.id)
      .order('created_at', { ascending: false });

    if (memesError) {
      document.getElementById('myMemes').textContent =
        'Не удалось загрузить мемы.';
      console.error(memesError);
      return;
    }

    const totalWins = (memes || []).reduce(
      (sum, meme) => sum + Number(meme.wins || 0), 0
    );

    document.getElementById('memesCount').textContent = memes.length;
    document.getElementById('wins').textContent = totalWins;

    const container = document.getElementById('myMemes');

    if (memes.length === 0) {
      container.textContent = 'Ты пока не отправил ни одного мема.';
      return;
    }

    container.replaceChildren();

    memes.forEach(meme => {
      const item = document.createElement('div');
      item.className = 'meme-item';

      const img = document.createElement('img');
      img.className = 'meme-image';
      img.src = meme.image_url;
      img.alt = 'Мой мем';
      img.loading = 'lazy';

      const details = document.createElement('div');
      details.className = 'meme-details';

      const statusNames = {
        pending: 'На проверке',
        approved: 'Одобрен',
        rejected: 'Отклонён'
      };

      const status = document.createElement('span');
      status.className = 'status status-' + (
        ['pending', 'approved', 'rejected'].includes(meme.status)
          ? meme.status
          : 'pending'
      );
      status.textContent = statusNames[meme.status] || 'Неизвестный статус';

      const wins = document.createElement('div');
      wins.className = 'meme-wins';
      wins.textContent = 'Побед: ' + Number(meme.wins || 0);

      details.append(status, wins);

      if (meme.status === 'rejected') {
        const reason = document.createElement('div');
        reason.className = 'rejection-reason';
        reason.textContent =
          'Причина отклонения: ' +
          (meme.rejection_reason || 'Причина не указана');

        details.appendChild(reason);
      }

      item.append(img, details);
      container.appendChild(item);
    });
  }

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    const { error } = await supabaseClient.auth.signOut();

    if (error) {
      message.textContent = 'Не удалось выйти из аккаунта.';
      return;
    }

    window.location.href = 'index.html';
  });

  loadProfile();
</script>

</body>
</html>
