
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мем Битва — Авторизация</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f6ff;
      font-family: Arial, sans-serif;
      color: #172b4d;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 40px 30px;
      background: white;
      border: 2px solid #dce7ff;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(30, 80, 160, 0.12);
      text-align: center;
    }

    h1 {
      color: #1769e0;
      font-size: 34px;
      margin: 0 0 10px;
    }

    .subtitle {
      color: #71809b;
      margin-bottom: 30px;
    }

    input {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 14px 0;
      border: 2px solid #d5e2f8;
      border-radius: 10px;
      background: #f8faff;
      color: #172b4d;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #1769e0;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #1769e0;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #0d50b5;
    }

    #registerBtn {
      background: #e53945;
    }

    #registerBtn:hover {
      background: #c62835;
    }

    #message {
      margin-top: 18px;
      font-size: 14px;
      color: #e53945;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>МЕМ БИТВА</h1>
    <div class="subtitle">Войди или создай аккаунт</div>

    <input
      type="text"
      id="username"
      placeholder="Никнейм"
      maxlength="20"
      autocomplete="username"
    >

    <input
      type="password"
      id="password"
      placeholder="Пароль"
      autocomplete="current-password"
    >

    <button id="loginBtn">Войти</button>
    <button id="registerBtn">Регистрация</button>

    <div id="message"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <script>
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const message = document.getElementById('message');

    function showMessage(text, success = false) {
      message.style.color = success ? '#1769e0' : '#e53945';
      message.textContent = text;
    }

    function getCredentials() {
      const username = usernameInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      if (!/^[a-z0-9_]{3,20}$/.test(username)) {
        showMessage('Ник: 3–20 символов, только английские буквы, цифры и _.');
        return null;
      }

      if (password.length < 6) {
        showMessage('Пароль должен содержать минимум 6 символов.');
        return null;
      }

      return {
        username,
        password,
        email: username + '@membattle.example'
      };
    }

    document.getElementById('registerBtn').onclick = async () => {
      const credentials = getCredentials();
      if (!credentials) return;

      showMessage('Создаём аккаунт...', true);

      const { username, password, email } = credentials;

      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: {
          data: { username }
        }
      });

      if (error) {
        showMessage(error.message);
        return;
      }

      if (data.session) {
        location.replace('index.html');
      } else {
        showMessage('Аккаунт создан, но вход не выполнен. Проверь настройки Supabase.');
      }
    };

    document.getElementById('loginBtn').onclick = async () => {
      const credentials = getCredentials();
      if (!credentials) return;

      showMessage('Выполняем вход...', true);

      const { email, password } = credentials;

      const { error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        showMessage('Неверный ник или пароль.');
        return;
      }

      location.replace('index.html');
    };

    if (typeof supabaseClient === 'undefined') {
      showMessage('Ошибка подключения Supabase. Проверь supabase.js.');
      document.getElementById('loginBtn').disabled = true;
      document.getElementById('registerBtn').disabled = true;
    }
  </script>
</body>
</html>
