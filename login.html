
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Авторизация — Мем Битва</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #151522;
      color: white;
      font-family: Arial, sans-serif;
    }
    .box {
      width: 90%;
      max-width: 380px;
      padding: 30px;
      box-sizing: border-box;
      background: #222235;
      border-radius: 18px;
      text-align: center;
    }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
    }
    button {
      background: #4169ff;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    #message { margin-top: 16px; }
  </style>
</head>
<body>

<div class="box">
  <h1>⚡ Мем Битва</h1>
  <h2>Регистрация / Вход</h2>

  <input id="username" placeholder="Ник (3–20 символов)" maxlength="20">
  <input id="password" type="password" placeholder="Пароль (от 6 символов)">

  <button id="registerBtn">Зарегистрироваться</button>
  <button id="loginBtn">Войти</button>

  <div id="message"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
const usernameInput = document.getElementById('username');
const passwordInput = document.getElementById('password');
const message = document.getElementById('message');

function showMessage(text, success = false) {
  message.textContent = text;
  message.style.color = success ? '#75ff91' : '#ff7777';
}

function getCredentials() {
  const username = usernameInput.value.trim().toLowerCase();
  const password = passwordInput.value;

  if (!/^[a-z0-9_]{3,20}$/.test(username)) {
    showMessage('Ник: английские буквы, цифры и _. От 3 до 20 символов.');
    return null;
  }

  if (password.length < 6) {
    showMessage('Пароль должен быть не короче 6 символов.');
    return null;
  }

  return { username, password, email: username + '@membattle.example' };
}

document.getElementById('registerBtn').onclick = async () => {
  const credentials = getCredentials();
  if (!credentials) return;

  const { username, password, email } = credentials;
  const { data, error } = await supabaseClient.auth.signUp({
    email,
    password,
    options: { data: { username } }
  });

  if (error) {
    showMessage(error.message);
    return;
  }

  if (data.session) {
    location.replace('index.html');
  } else {
    showMessage('Аккаунт создан, но вход не выполнен. Проверь настройки Supabase.');
  }
};

document.getElementById('loginBtn').onclick = async () => {
  const credentials = getCredentials();
  if (!credentials) return;

  const { email, password } = credentials;
  const { error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    showMessage('Неверный ник или пароль.');
    return;
  }

  location.replace('index.html');
};

if (typeof supabaseClient === 'undefined') {
  showMessage('Ошибка подключения Supabase. Проверь supabase.js.');
}
</script>

</body>
</html>
